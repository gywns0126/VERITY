name: Daily Briefing (시장 브리핑 — 홈 카드 · 상시 갱신)

# 데일리 브리핑 v0 (PM 2026-07-05, project_daily_briefing_design): 기존 발행 피드 재조립만
# (신규 수집 0 · LLM 0 · RULE 6/7 — 사실+예정 사실, 판단 동사 금지) → daily_briefing.json → 홈 최상단 카드.
#
# 7축 audit:
#  1 env: 없음 (순수 변환 — 로컬 data/ 만 읽음)
#  2 push trigger: vercel-api/ 미변경 — Vercel deploy 무관 (RULE 2)
#  3 concurrency: 전용 그룹 (verity-data-write 공유 시 pending 축출 — 7/4 학습)
#  4 cron: UTC 22:30 = KST 07:30 아침 발행 + workflow_run 체인(kr_chart_daily 완료 시 = 지수 kr_index_daily 최신화 직후 오후 자동 재발행 → 시장 recap 을 어제 종가로 갱신). 2026-07-14 신설: 아침엔 FSC T+1 지연으로 recap 이 직전 영업일 이전에 머무는 문제 해소. gh cron 지연은 컴포넌트 generated_at 표시로 흡수(고정 시각 표기 폐기).
#  5 KIS: 0 (RULE 1 무관)
#  6 pip: 불요 (stdlib only) — setup-python 만
#  7 N=2: push 후 dispatch(N=1) + 익 kr_chart_daily 체인/scheduled(N=2) 실 결과 검증 의무 (RULE 8)
# RULE 4: 산출 daily_briefing.json + daily_briefing_history.jsonl = git add data/ (broad) 커버.

on:
  schedule:
    # 🚨 2026-07-28 상시 갱신 전환 (PM: "모닝을 빼고 수시로 체크"). 3시간마다 재조립 —
    #   사용자가 언제 들어와도 최근 상태를 본다. 순수 변환(신규 수집 0 · pip 0 · KIS 0)이라
    #   run 당 ~1분, 8회/일. 산출이 동일하면 커밋 자체를 건너뛰므로 Vercel/커밋 소음도 없다.
    - cron: '30 21 * * *'   # KST 06:30 — 개장 전 준비
    - cron: '0 */3 * * *'   # KST 09/12/15/18/21/00/03/06 — 상시 갱신
  workflow_run:
    workflows: ["KR Chart Daily (FSC public data)"]   # 지수(kr_index_daily) 최신화 완료 직후 자동 재발행 → recap 어제 종가 반영
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verity-daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    # 체인(workflow_run) 은 소스(kr_chart_daily) 성공 시에만 — schedule/workflow_dispatch 는 항상 실행.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 브리핑 조립 (순수 변환)
        run: python -m api.builders.daily_briefing_builder

      - name: Commit + push (변경 시만)
        if: always()
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/
          git diff --staged --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "data(alpha-nest): 시장 브리핑 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin "$BRANCH" && git push origin "$BRANCH"; then
              echo "pushed"; exit 0
            fi
            echo "push attempt $i failed, retry in $((i*10))s"; sleep $((i*10))
          done
          echo "::error::5회 push 실패"; exit 1

      - name: Publish (VERITY-data + Vercel Blob)
        # 🚨 2026-07-11 순서 fix — 옛 순서(Publish→Commit)는 publish-data 가 origin/main HEAD
        #   에서 추출하므로 자기 run 산출물이 아직 push 전 = 매번 직전 run 분을 발행(한 사이클
        #   지연, 7/10 v2 가 2시간+ Blob 미도달 실측). commit push 후 publish 로 교체.
        if: always()
        continue-on-error: true
        uses: ./.github/actions/publish-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.VERITY_DATA_PAT }}
          blob_token: ${{ secrets.VERCEL_BLOB_TOKEN }}
