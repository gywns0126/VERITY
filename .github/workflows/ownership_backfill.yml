name: ownership-backfill

# Public normalized company structure. No raw capture/submissions cache is staged.
# Physical request budgets (durable KST day): KR <=300 issuers /600 GET;
# US <=100 distinct CIK /200 HTTP. New structure path reads tracked mapping: 0 HTTP.
# Existing legacy mapping freshness behavior is unchanged, not a new self-repair path.
# Legacy ownership is preserved separately: <=300 initial calls + new <=600 GET
# = <=900 initial/logical requests. Existing DartScout has nested HTTP retries:
# this is NOT a proven <=900 physical HTTP bound (legacy retry policy unchanged).
# Endpoints: opendart.fss.or.kr/api/{hyslrSttus,otrCprInvstmntSttus}.json;
# www.sec.gov/Archives/edgar/data/{CIK}/{accession}/ (index + reported list:
# 10-K EX-21 / 20-F EX-8.1, as validated by the existing parser; never VIE inference).
# 7-axis audit: scoped existing secrets; no push trigger; unchanged concurrency;
# unchanged daily cron; no KIS/LLM execution; requirements + locked Blob SDK;
# manual + next scheduled audits remain REQUIRED after authorized rollout (not run here).

on:
  repository_dispatch:
    types: [ownership_backfill]
  schedule:
    - cron: '40 19 * * *'   # UTC 19:40 = KST 04:40 — 타 DART 워크플로 슬롯 회피
  workflow_dispatch:
    inputs:
      chunk:
        description: '이번 run 에서 채울 종목 수 (기본 300)'
        required: false
        default: '300'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.slot.outputs.run }}
      status: ${{ steps.slot.outputs.status }}
    steps:
      - uses: actions/github-script@v7
        id: slot
        with:
          script: |
            // Use GitHub's current-run timestamp, not a new clock/cron service.
            // A delayed GH schedule still belongs to its original 19:40 UTC cycle.
            const current = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            const attempt = current.data.run_attempt;
            if (!Number.isInteger(attempt) || attempt < 1) throw new Error('Invalid run attempt');
            const created = new Date(current.data.created_at);
            if (!Number.isFinite(created.getTime())) throw new Error('Invalid run timestamp');
            const due = new Date(created);
            due.setUTCHours(19, 40, 0, 0);
            if (due > created) due.setUTCDate(due.getUTCDate() - 1);
            const slot = due.toISOString();
            if (context.eventName === 'repository_dispatch') {
              const supplied = context.payload.client_payload?.schedule_slot;
              if (!supplied || !Number.isFinite(Date.parse(supplied)) || new Date(supplied).toISOString() !== slot) {
                throw new Error('Invalid ownership schedule_slot');
              }
            }
            // A killed CI job can spend GETs before its local budget reaches Git.
            // The remote run registry conservatively permits ONE attempt per KST
            // day, across dispatch, delayed native schedule AND manual events.
            const kst = new Date(created.getTime() + 9 * 60 * 60 * 1000);
            const dayStart = new Date(Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate()) - 9 * 60 * 60 * 1000);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'ownership_backfill.yml',
              branch: context.payload.repository.default_branch,
              created: `>=${dayStart.toISOString()}`, per_page: 100
            });
            // A failed/cancelled/queued prior attempt still consumes the daily
            // allowance, even if it predates 19:40. Query failure fails closed.
            const duplicate = attempt > 1 || runs.some(run => run.id < context.runId);
            core.setOutput('run', String(!duplicate));
            core.setOutput('status', duplicate ? 'idle-already-attempted' : 'first-daily-attempt');
            core.info(duplicate ? 'Idle: ownership already attempted this KST day (not a new collection success)' : 'First ownership attempt this KST day');
  backfill:
    needs: cadence
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && needs.cadence.result == 'success' && needs.cadence.outputs.run == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: verity-ownership-backfill
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        # 🚨 requests 만으로는 부족하다 — DartScout → stock_data 임포트 체인이 yfinance 를
        #   끌어온다(2026-08-08 N=1 manual run 이 ModuleNotFoundError 로 잡음).
        #   최소 설치로 아끼려다 실패하느니 다른 DART 워크플로와 같은 기준을 쓴다.
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install existing Blob dependency
        run: npm ci --workspaces=false --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Validate tracked input and normalize durable stores
        id: prepare
        run: |
          set -euo pipefail
          git ls-files --error-unmatch data/mapping.json
          python - <<'PY'
          import importlib.util, json, pathlib
          p = pathlib.Path('api/collectors/company_structure_refresh.py')
          spec = importlib.util.spec_from_file_location('kr_structure', p)
          core = importlib.util.module_from_spec(spec); spec.loader.exec_module(core)
          mapping = core.read_json('data/mapping.json')
          assert isinstance(mapping, dict) and mapping, 'tracked mapping required; no self-repair'
          store = pathlib.Path('data/member_map_company_structure_sources.json')
          doc = core.build_document('data', core.read_json(store) if store.exists() else None)
          core.atomic_json(store, doc)
          us = pathlib.Path('data/member_map_company_structure_us_sources.json')
          if not us.exists():
              core.atomic_json(us, {'schema':'alphanest-company-structure-us-sources-v1', 'generatedAt':doc['generatedAt'], 'issuers':{}})
          PY
          node - <<'JS'
          const fs = require('node:fs');
          const {sanitizeUsSources} = require('./scripts/member-map/publish-company-structure.cjs');
          const file = 'data/member_map_company_structure_us_sources.json';
          fs.writeFileSync(file + '.tmp', JSON.stringify(sanitizeUsSources(JSON.parse(fs.readFileSync(file)))) + '\n');
          fs.renameSync(file + '.tmp', file); // Clears any previous-run summary before the current attempt.
          JS

      - name: Refresh bounded KR corporate sources
        id: kr
        continue-on-error: true
        env:
          VERITY_MODE: prod
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          REQUESTED_CHUNK: ${{ github.event.inputs.chunk || '300' }}
        run: |
          set -euo pipefail
          limit=$(python -c 'import os; n=int(os.environ["REQUESTED_CHUNK"]); assert 0 <= n <= 300; print(n)')
          python scripts/member-map/refresh-company-structure.py --source-dir data --store data/member_map_company_structure_sources.json --limit "$limit" --fetch-public

      - name: Refresh bounded SEC exhibits
        id: us
        continue-on-error: true
        run: python scripts/member-map/refresh-us-company-structure.py --source-dir data --store data/member_map_company_structure_us_sources.json --limit 100 --fetch-public

      - name: Normalize public durable source fields even after refresh failure
        id: safe
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, os, pathlib
          spec = importlib.util.spec_from_file_location('kr_structure', 'api/collectors/company_structure_refresh.py')
          core = importlib.util.module_from_spec(spec); spec.loader.exec_module(core)
          store = 'data/member_map_company_structure_sources.json'
          original = core.read_json(store)
          statuses = {}
          for market, value in [('KR', original), ('US', core.read_json('data/member_map_company_structure_us_sources.json'))]:
              summary = value.get('summary', {})
              reason = summary.get('stopReason')
              statuses[market] = {'hasSummary': bool(summary), 'error': summary.get('error', 1),
                  'normalDeferred': reason in ('daily-request-budget', 'daily-http-budget')
                      and summary.get('error') == 0 and summary.get('guardedBudget', {}).get('valid') is True}
          core.atomic_json(pathlib.Path(os.environ['RUNNER_TEMP']) / 'company-structure-run-status.json', statuses)
          doc = core.sanitize_document(original)
          core.atomic_json(store, doc)  # requestBudget + per-endpoint failures retained; no rawResponse/personal rows.
          PY
          node - <<'JS'
          const fs = require('node:fs');
          const {sanitizeUsSources} = require('./scripts/member-map/publish-company-structure.cjs');
          const file = 'data/member_map_company_structure_us_sources.json';
          const safe = sanitizeUsSources(JSON.parse(fs.readFileSync(file)));
          fs.writeFileSync(file + '.tmp', JSON.stringify(safe) + '\n'); fs.renameSync(file + '.tmp', file);
          JS

      - name: Backfill ownership (existing annual collector unchanged)
        id: legacy
        if: ${{ always() && steps.safe.outcome == 'success' }}
        env:
          VERITY_MODE: prod
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          REQUESTED_CHUNK: ${{ github.event.inputs.chunk || '300' }}
        run: |
          set -euo pipefail
          export OWNERSHIP_CHUNK=$(python -c 'import os; n=int(os.environ["REQUESTED_CHUNK"]); assert 0 <= n <= 300; print(n)')
          python -m api.builders.ownership_backfill_builder

      - name: Build and validate compact public artifacts offline
        id: build
        if: ${{ always() && steps.safe.outcome == 'success' }}
        run: |
          set -euo pipefail
          node scripts/member-map/build-live-company-structure.cjs --source-dir "$GITHUB_WORKSPACE/data" --sources data/member_map_company_structure_sources.json --us-sources data/member_map_company_structure_us_sources.json --output-dir "$RUNNER_TEMP/company-structure-public"
          node scripts/member-map/publish-company-structure.cjs --output-dir "$RUNNER_TEMP/company-structure-public"
          cp "$RUNNER_TEMP/company-structure-public/member_map_company_structure_index.json" data/member_map_company_structure_index.json

      - name: Persist sanitized sources and failure budgets before publication
        id: durable
        if: ${{ always() && steps.safe.outcome == 'success' }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          LEGACY_OUTCOME: ${{ steps.legacy.outcome }}
        run: |
          set -euo pipefail
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git diff --cached --quiet
          git add data/member_map_company_structure_sources.json
          git add data/member_map_company_structure_us_sources.json
          if [ "$LEGACY_OUTCOME" = success ]; then
            git add data/kr_ownership.json
            git add data/metadata/kr_ownership_cursor.json
          fi
          if [ "$BUILD_OUTCOME" = success ]; then
            git add data/member_map_company_structure_index.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public corporate structure sources and budgets"
          fi
          # Fail closed on concurrent data changes: no -X theirs/ours and no swallowed push failure.
          git pull --rebase --autostash origin main
          # Autostash restoration can leave conflicts after a successful rebase.
          test -z "$(git ls-files -u)"
          git push origin HEAD:main
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Publish verified immutable payloads then manifest
        # Source failures are represented in the manifest, not used to hide healthy sources.
        if: ${{ always() && steps.safe.outcome == 'success' && steps.durable.outcome == 'success' && steps.build.outcome == 'success' }}
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/member-map/publish-company-structure.cjs --output-dir "$RUNNER_TEMP/company-structure-public" --committed-manifest data/member_map_company_structure_index.json --publish

      - name: Report collection failures after durable checkpoint
        if: ${{ always() && (steps.kr.outcome == 'failure' || steps.us.outcome == 'failure') }}
        env:
          KR_OUTCOME: ${{ steps.kr.outcome }}
          US_OUTCOME: ${{ steps.us.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          status = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'company-structure-run-status.json').read_text())
          errors = [m for m in ('KR', 'US') if os.environ[m + '_OUTCOME'] == 'failure'
                    and not status.get(m, {}).get('normalDeferred', False)]
          if errors:
              print('::error::Source refresh error: ' + ','.join(errors) + '; retained snapshot/failure labels can publish only after safe/build/durable checks.')
              raise SystemExit(1)
          print('Bounded daily budget reached without source errors; remaining requests are deferred.')
          PY
