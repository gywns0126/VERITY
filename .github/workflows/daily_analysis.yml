name: Stock Analysis Pipeline (Quick — Off-hours)

# 5/11 분리: realtime/realtime_us cron 은 daily_realtime.yml (group: verity-realtime) 로 이관.
# 본 워크플로는 quick (시간 정각) 만 담당. group: verity-data-write 잔존 (daily_analysis_full / bond_etf 등과 직렬화).
# full/full_us/periodic_* 는 daily_analysis_full.yml.

on:
  # Vercel Cron 매분 → minute == 7 시점에 daily_analysis_quick dispatch (1시간당 1회).
  # GH schedule (`7 8-15`, `7 16-22`) 12/13/14시 미발화 확인됨 → schedule 폐기, dispatch 단일.
  repository_dispatch:
    types: [daily_analysis_quick]
  workflow_dispatch:
    inputs:
      mode:
        description: '분석 모드 (quick) — realtime/realtime_us 는 daily_realtime.yml, full 은 daily_analysis_full.yml'
        required: false
        default: ''
        type: string

# Node.js 24 강제 — 2026-06-02 GitHub Node 20 deprecation 대비 (2026-05-07)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # 🚨 RULE 1 — GH Actions 단일 발급원 (PM 2026-05-31). 발급 직후 Supabase publish (Railway/Vercel 소비).
  KIS_SHARED_TOKEN: "1"
  # 🚨 RULE 1 이중발급 fix (2026-08-02, PM 승인 option1) — 이 워크플로는 발급 금지, 공유 토큰 읽기 전용.
  #   7/21·6/26 daily_realtime×daily_analysis 동시 발급 실증. 발급자 = kis_token_refresh(주)+daily_realtime(백업)만.
  KIS_CACHE_ONLY: "1"

permissions:
  contents: write

concurrency:
  # WARN-17: data/* 쓰기 워크플로 단일 그룹 직렬화 (bond_etf/export_trade/daily_analysis_full 공유)
  # cancel 대신 큐잉 — 저장 도중 취소되면 JSON 손상 + VAMS lost-update 위험.
  group: verity-data-write
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # 2026-05-16 cron audit: quick 모드 평균 10-15분. 90분 → 30분 축소 (runner 효율).
    # repository_dispatch 매 1시간 발화. full 모드는 daily_analysis_full.yml (90분 유지).
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # B-3: brain_evolution 의 git log 분석 위해 100 commit 보유
          fetch-depth: 100

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 현재 날짜 (KST)
        id: date
        run: echo "today=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: KIS 토큰 캐시 복원 (하루 1회 재발급 보장)
        uses: actions/cache@v4
        with:
          path: ~/.cache/verity_kis_token.json
          key: kis-token-v2-${{ runner.os }}-${{ steps.date.outputs.today }}
          restore-keys: |
            kis-token-v2-${{ runner.os }}-

      # Secrets 미등록 시 빈 문자열로 넘어가며 헬스만 '키 미설정' — Actions 로그에서 원인 확인용
      - name: Check optional trade/patent API secrets
        env:
          KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY || vars.KIPRIS_API_KEY }}
          KIPRIS_ACCESS_KEY: ${{ secrets.KIPRIS_ACCESS_KEY || vars.KIPRIS_ACCESS_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY || vars.PUBLIC_DATA_API_KEY }}
        run: |
          if [ -z "$KIPRIS_API_KEY" ] && [ -z "$KIPRIS_ACCESS_KEY" ]; then
            echo "::warning::KIPRIS: KIPRIS_API_KEY 또는 KIPRIS_ACCESS_KEY 없음 (Actions secrets/variables, 이 저장소에 등록)"
          fi
          if [ -z "$PUBLIC_DATA_API_KEY" ]; then
            echo "::warning::관세청: PUBLIC_DATA_API_KEY 없음 (공공데이터포털 키, secrets 또는 variables 동일 이름)"
          fi
          KRX_API_KEY="${{ secrets.KRX_API_KEY || vars.KRX_API_KEY }}"
          if [ -z "$KRX_API_KEY" ]; then
            echo "::warning::KRX: KRX_API_KEY 없음 — Open API 연동 시 Secrets(또는 Variables)에 등록. 키만으로는 부족하고 API별 이용신청 필요 → docs/KRX_OPEN_API_SETUP.md"
          fi

      - name: Ensure Korean font for PDF
        run: |
          mkdir -p api/reports/fonts
          if [ ! -f api/reports/fonts/NanumGothic.ttf ]; then
            curl -sL -o api/reports/fonts/NanumGothic.ttf \
              "https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Regular.ttf"
            curl -sL -o api/reports/fonts/NanumGothicBold.ttf \
              "https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Bold.ttf"
          fi

      - name: Detect schedule mode
        id: detect_mode
        run: |
          CRON="${{ github.event.schedule }}"
          MANUAL="${{ github.event.inputs.mode }}"
          if [ -n "$MANUAL" ]; then
            echo "mode=$MANUAL" >> $GITHUB_OUTPUT
          elif [ "$CRON" = "7 8-15 * * 1-5" ] || [ "$CRON" = "7 16-22 * * 0-4" ]; then
            echo "mode=quick" >> $GITHUB_OUTPUT
          else
            echo "mode=quick" >> $GITHUB_OUTPUT
          fi

      # KIS [C] 보강 (commit bac4ec2 재활성화 조건) —
      # KIS 토큰을 분석 시작 전에 발급하고 daily lock 을 즉시 push.
      # 기존 흐름: analysis step 안에서 발급 → 끝나야 commit/push 발생.
      #           그 사이 KIS Token Refresh cron 이 stale lock 보고 재발급 위험 (5/3 사고 원인).
      # 본 step: lock 파일을 ~수초 안에 origin 에 push → 다음 cron 의 fresh checkout 이 즉시 인지.
      - name: KIS preflight (issue + immediate lock push)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_OPENAPI_BASE_URL: ${{ secrets.KIS_OPENAPI_BASE_URL || vars.KIS_OPENAPI_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KIS_APP_KEY" ]; then
            echo "[KIS preflight] secrets 미설정 — skip"
            exit 0
          fi
          python - <<'PYEOF'
          import sys, os
          sys.path.insert(0, os.getcwd())
          try:
              from api.trading.kis_broker import KISBroker
              broker = KISBroker()
              if not broker.is_configured:
                  print("[KIS preflight] 미설정 — skip")
                  sys.exit(0)
              # 2026-05-13 자정 race fix: date 비교 → 시각 기반 interval
              # 2026-05-29 RULE 1 정정: 23h → 24h (5/27 00:08+23:08 / 5/28 22:11 매일 알림 사고)
              if broker._is_recently_issued(hours=24):
                  print("[KIS preflight] 24h 이내 발급 — skip")
                  sys.exit(0)
              token = broker.authenticate(force_refresh=False)
              print(f"[KIS preflight] 발급 완료: {token[:8]}***")
          except Exception as e:
              print(f"[KIS preflight] 실패 (analysis step 에서 재시도): {e}")
              sys.exit(0)
          PYEOF

      - name: Daily lock immediate push (KIS [C])
        if: always()
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
        run: |
          if [ -z "$KIS_APP_KEY" ]; then
            echo "[lock push] KIS 미설정 — skip"
            exit 0
          fi
          if [ ! -f data/.kis_issued_date.txt ]; then
            echo "[lock push] 파일 없음 — preflight 발급 skip 케이스. 종료"
            exit 0
          fi
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/.kis_issued_date.txt
          git add data/metadata/llm_cost.jsonl 2>/dev/null || true   # RULE 4 — LLM 비용 장부(미add 시 rebase 거부)
          if git diff --staged --quiet; then
            echo "[lock push] 변화 없음 — origin 이미 동기"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git commit -m "🔐 KIS daily lock ${TODAY} (preflight)"
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash -X ours origin "$BRANCH" && git push origin "$BRANCH"; then
              echo "[lock push] ✓ 성공 (시도 $i)"
              exit 0
            fi
            echo "[lock push] 시도 $i 실패 — 재시도"
            sleep $((i * 5))
          done
          echo "::warning::[lock push] 3회 실패 — 분석 끝 commit step 에서 재시도"

      - name: Run analysis
        env:
          # 🚨 2026-08-19 — AI 와 데이터를 가르는 축. **신설이 아니라 이미 있던 staging 을 쓴다.**
          #
          #   문제: 기본값이 `dev` 라 `@mockable` 이 붙은 것을 **전부** 막는다. AI 비용을
          #   아끼려던 설정이 finnhub 수급·컨센서스까지 mock 으로 만들고 있었다.
          #   실측(2026-08-19) — quick 이 mock 64건을 냈고 전부 finnhub 4키 × 16종목이다.
          #   그 16종목이 `portfolio.json` 의 Finnhub 계열 미보유 16과 **정확히 일치**한다
          #   (AGCO AIT ALGN ALV AME EXE GOOGL DVN KMT ALB NEM VICI TAP TROW EPAM LKQ).
          #   🚨 실제 보유 종목(EXE·GOOGL·DVN·NEM…)이 그쪽에 몰려 있었다 — 판단에 쓰는
          #   종목일수록 가짜 데이터를 받고 있었다.
          #
          #   해법: `staging` = allowlist 만 실호출(`api/mocks/__init__.py:58 _should_mock`).
          #   데이터 키를 allowlist 에 넣고 AI 키(gemini 14 · perplexity 4)는
          #   뺀다 → **데이터 실호출 + AI 차단**. 코드 변경 0.
          #
          #   🚨 오타 하나면 조용히 mock 으로 돌아간다 — 값은 키 이름과 **정확히** 일치해야
          #   하고(`api/mocks` `@mockable(...)` 인자), 첫 run 에서 `[MOCK CENSUS]` 에
          #   finnhub 키가 0건인지 확인 의무 (RULE 8 N=2). 검증 = tests/test_staging_real_keys.py
          VERITY_MODE: staging
          VERITY_STAGING_REAL_KEYS: "finnhub.analyst_consensus,finnhub.earnings_surprises,finnhub.insider_sentiment,finnhub.institutional_ownership,finnhub.basic_financials,finnhub.company_news,finnhub.peer_companies,polygon.short_interest,polygon.pre_after_market,polygon.options_flow,newsapi.us_stock_news,newsapi.market_news"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          VAMS_INITIAL_CASH: ${{ vars.VAMS_INITIAL_CASH || '10000000' }}
          VAMS_MAX_PER_STOCK: ${{ vars.VAMS_MAX_PER_STOCK || '2000000' }}
          ANALYSIS_MODE: ${{ steps.detect_mode.outputs.mode }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY || vars.KIPRIS_API_KEY }}
          KIPRIS_ACCESS_KEY: ${{ secrets.KIPRIS_ACCESS_KEY || vars.KIPRIS_ACCESS_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY || vars.PUBLIC_DATA_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY || vars.KRX_API_KEY }}
          KRX_OPENAPI_KEY: ${{ secrets.KRX_API_KEY || vars.KRX_API_KEY }}
          # Phase 2-A — Realtime/Quick 강제 비활성화 ("0" → backward compat Gate 1 발동 → 코어 85 fallback).
          # 이유: 매 15분 실행 + 500종목 처리 시 yfinance/KRX 부하 폭발. Phase 2-A 는 full 1일 1회 전제.
          # Full 모드는 daily_analysis_full.yml 에서 secrets.UNIVERSE_RAMP_UP_STAGE 로 별도 활성화.
          UNIVERSE_RAMP_UP_STAGE: "0"
          GEMINI_MODEL_CRITICAL: ${{ vars.GEMINI_MODEL_CRITICAL || 'gemini-2.5-pro' }}
          GEMINI_PRO_ENABLE: ${{ vars.GEMINI_PRO_ENABLE || '1' }}
          GEMINI_CRITICAL_TOP_N: ${{ vars.GEMINI_CRITICAL_TOP_N || '3' }}
          DEADMAN_FAIL_THRESHOLD: ${{ vars.DEADMAN_FAIL_THRESHOLD || '3' }}
          REPORT_SEND_HOUR_KST: ${{ vars.REPORT_SEND_HOUR_KST || '16' }}
          REPORT_SEND_MINUTE_KST: ${{ vars.REPORT_SEND_MINUTE_KST || '30' }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_TIER: ${{ vars.POLYGON_TIER || 'free' }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWSAPI_MAX_ARTICLES: ${{ vars.NEWSAPI_MAX_ARTICLES || '5' }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_OPENAPI_BASE_URL: ${{ secrets.KIS_OPENAPI_BASE_URL || vars.KIS_OPENAPI_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          # SERVICE_ROLE_KEY: api/health.py _check_reports_signed_url 가 signed URL 발급 검증할 때 필요 (write 권한).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python api/main.py

      - name: Promote paper summary to operator portfolio
        # Quick는 VERITY_MODE=staging이라 최신 전체 결과가 portfolio.dev.json에 저장된다.
        # 전체 staging 결과를 섞지 않고, 상태 원장과 일치한 exec_paper 한 필드만 승격한다.
        run: |
          if git diff --quiet -- data/portfolio.dev.json; then
            echo "::error::portfolio.dev.json unchanged — current Quick result not proven"
            exit 1
          fi
          python scripts/promote_exec_paper_to_portfolio.py 2>&1 | tee /tmp/exec_paper_promote.log
          grep -qx "exec paper promote: 1/1" /tmp/exec_paper_promote.log

      # Tranche B dual-write (#9 봉인) — 크라운주얼 트레일을 VERITY-private 에도 동기.
      # 단계 설계(private_data.py MANIFEST): dual-write N=2 검증 → 소비자 pull 배선 → public 추적 해제.
      # continue-on-error + 스크립트 자체 토큰-없음 skip = 파이프라인 보호. 변경 시에만 push(무변경 커밋 방지).
      # 🚨 public 추적 해제 후엔 git diff 가드가 무력(untracked=quiet) — 해제 시 가드 제거 의무.
      - name: Private data sync (Tranche B)
        if: always()
        continue-on-error: true
        env:
          PRIVATE_DATA_PAT: ${{ secrets.PRIVATE_DATA_PAT }}
        run: |
          for f in data/factor_ic_history.json data/recommendations.json data/portfolio.json; do
            if git diff --quiet -- "$f" && git diff --cached --quiet -- "$f"; then
              echo "[private_data] unchanged skip $f"
            else
              python scripts/private_data.py push "$f"
            fi
          done

      - name: Commit & push results
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/
          HOUR_KST=$(TZ=Asia/Seoul date +%H:%M)
          MODE="${{ steps.detect_mode.outputs.mode }}"
          if [[ "$MODE" == periodic_* ]]; then
            LABEL=$(echo "$MODE" | sed 's/periodic_//')
            git diff --staged --quiet || git commit -m "📋 ${LABEL} 리포트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          else
            git diff --staged --quiet || git commit -m "📊 분석 업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d) ${HOUR_KST}"
          fi
          BRANCH="${{ github.ref_name }}"
          PUSHED=false
          # 재시도 8회 + 지터 (2026-08-06 실패 fix) — main 에 push 하는 워크플로가 56개,
          # 봇 커밋 하루 292개. 고정 간격 재시도는 여러 워크플로가 같은 리듬으로 재충돌한다.
          for i in 1 2 3 4 5 6 7 8; do
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            if git pull --rebase --autostash -X theirs origin "$BRANCH" && git push origin "$BRANCH"; then
              PUSHED=true
              break
            fi
            WAIT=$(( i * 7 + RANDOM % 15 ))
            echo "Push attempt $i failed, retrying in ${WAIT}s (jittered)..."
            sleep "$WAIT"
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::All 8 push attempts failed (main 경합) — 다음 스케줄에서 재시도"
            exit 1
          fi

      - name: Upload operator portfolio to private Supabase Storage
        # /system 은 private portfolio_full 을 우선 읽는다. 승격된 Quick 요약도 origin/main 커밋 뒤
        # 즉시 동기화해 정본과 오퍼레이터 화면 사이의 stale 간격을 없앤다.
        # portfolio_full 1개만 선택해 다른 저빈도 오퍼레이터 산출물을 되돌리지 않는다.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/upload_operator_data_to_supabase.py --only portfolio_full 2>&1 | tee /tmp/operator_portfolio_upload.log
          grep -qx "operator upload: 1/1" /tmp/operator_portfolio_upload.log

      - name: Publish hot data to VERITY-data
        # Phase A: dual-write — main 에도 commit (위), gh-pages 에도 force-orphan push.
        # 검증 후 Phase B 에서 fetch URL 마이그레이션, Phase C 에서 main commit 제거.
        if: always()
        uses: ./.github/actions/publish-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.VERITY_DATA_PAT }}
          blob_token: ${{ secrets.VERCEL_BLOB_TOKEN }}
