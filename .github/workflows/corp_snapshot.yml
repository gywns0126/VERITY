# VERITY ESTATE — 상장사 부동산 자산 시계열 (DART 사업보고서)
# 매년 4월 5일 KST 02:00 (UTC 17:00 4/4) — 사업보고서 통상 3월 말 공시 + 1주 버퍼
# 결과: estate_corp_holdings + estate_corp_facilities (Supabase)

name: ESTATE Corp Snapshot

on:
  schedule:
    # 사업보고서 3월말 마감 + 1~3주 redundancy (단일 4/5 cron = workflow 미배포 시 silent miss
    # 사고 학습: 2026-04 yml 4/26 추가 → 4/5 발화 0 → 다음 2027. redundancy 3회로 절대 miss X)
    # 매년 4월 5일 / 12일 / 20일 KST 02:07 = UTC 17:07
    - cron: '7 17 5,12,20 4 *'
  workflow_dispatch:
    inputs:
      year:
        description: '대상 사업연도 (YYYY, 비우면 전년도)'
        required: false
        default: ''
      tickers:
        description: '쉼표 구분 ticker (예: 005930,066570). 비우면 portfolio.json 일괄'
        required: false
        default: ''
      limit:
        description: '최대 처리 종목 수 (0=무제한, spike test 용)'
        required: false
        default: '0'

# Node.js 24 강제 — 2026-06-02 GitHub Node 20 deprecation 대비 (2026-05-07)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write   # 장부 커밋용(산출물은 gitignore 봉인)

concurrency:
  group: corp-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 2026-05-16 cron audit: 연 1회 사업보고서 수집 cron, 90분 → 30분 축소.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install lxml

      - name: Snapshot
        env:
          DART_API_KEY:              ${{ secrets.DART_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          YEAR="${{ inputs.year }}"
          TICKERS="${{ inputs.tickers }}"
          LIMIT="${{ inputs.limit }}"
          ARGS=""
          if [ -n "$YEAR" ]; then ARGS="$ARGS --year $YEAR"; fi
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ -n "$TICKERS" ]; then
            python scripts/estate_corp_snapshot.py --tickers "$TICKERS" $ARGS
          else
            python scripts/estate_corp_snapshot.py --portfolio data/portfolio.json $ARGS
          fi

      - name: Commit LLM cost ledger (RULE 4 — 산출물은 gitignore 로 봉인 유지)
        if: always()
        run: |
          # 🚨 이 워크플로의 산출물(크라운주얼)은 .gitignore 로 커밋이 원천 차단되어 있다.
          #   여기서 커밋하는 것은 **비용 장부뿐** — 가장 비싼 LLM 호출이 관측에서 빠지던
          #   사각지대 해소(2026-08-06). 장부 미add 시 rebase 거부 사고도 함께 예방(RULE 4).
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/metadata/llm_cost.jsonl 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "💰 llm_cost 장부 — 기업 스냅샷"
          for i in 1 2 3 4 5 6; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin main && git push origin main; then exit 0; fi
            sleep $(( i * 7 + RANDOM % 15 ))
          done
          echo "::warning::장부 push 실패 — 다음 run 에서 누적 재시도"
