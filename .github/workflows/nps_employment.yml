name: nps-employment

# 상장사 고용 동향 (국민연금 가입 사업장) — 공단 갱신 = 매월 15일 이후
# 데이터 = 최근 1년 창만 제공 → 월 1회 스냅샷 누적이 시계열 자산 (history.jsonl)
# 콜 ≈ 3.5K/run (dev 한도 10K/일 내)
#
# 🚨 2026-08-07 사고 대응: 월 1회 단발이라 그 한 번이 실패하면 **한 달을 통째로 잃는다**.
#   2026-07-15 정기 run 이 90분 timeout 으로 죽어 6월분을 못 받았고, 데이터가 5월에
#   한 달간 묶여 있었다(PM 지적 "아직도 5월달 기준임"). 세 갈래로 고침:
#     ① timeout 90 → 180분 (실측이 90분을 넘겼는데 주석은 "~30분" 이었다)
#     ② 워커 8 → 20 (5 tx/s, 한도 30tx/s 의 1/6)
#     ③ 회차 증설 — 수집기가 종목별 기준월을 병합하므로 이미 최신이면 재수집분이
#        그대로 덮어써 no-op 에 가깝고, 앞 회차가 죽어도 같은 달 안에 만회한다.
#
# 🚨 2026-08-08 정정: ①②는 증상 대응이었고 진짜 원인은 **러너 IP 차단**이었다(아래 cron 주석).
#   워커 8→20 상향을 원인으로 지목했던 진단은 오진 — 되돌린 8워커에서도 동일 전멸이 재현됐다.
#   수동 복구가 필요하면 **한국 IP 에서 로컬 실행**이 가장 확실하다:
#     PUBLIC_DATA_API_KEY=... python api/collectors/nps_employment.py
#   (개발 맥에서 해당 호스트는 정상 응답 — 2026-08-08 실측)

on:
  schedule:
    # 🚨 2026-08-08 재설계 — 실패 원인이 "가끔 실패" 가 아니라 **러너 IP 의존**이었다.
    #   증거: 같은 코드·같은 키로 8종목 스모크는 성공(21:14), 4분 뒤 전량은 전멸(21:18).
    #   러너에서만 ConnectTimeout(거부도 403 도 아닌 **타임아웃** = 방화벽 드롭)이고,
    #   한국 IP(개발 맥)에서는 http·https 모두 0.06초에 연결되고 403(키 오류)을 정상 반환한다.
    #   → apis.data.go.kr 이 일부 해외/GH 대역을 드롭한다. 러너 IP 는 실행마다 달라지므로
    #     "언젠가 좋은 IP 에 걸린다". 같은 패턴 선례 = yfinance curl_cffi(Yahoo GH IP 차단).
    #
    #   2026-08-27: 7월 자료가 8/25 실행 뒤에 공개되어 다음 수집이 9/16까지 밀리는 공백 확인.
    #   월말까지 매일 원천 최신월만 3개 법인으로 탐침하고, 새 월일 때만 전량 수집한다.
    #   최신월이 같으면 API 3콜로 종료하므로 Actions/API 부하는 종전 전량 재수집보다 작다.
    - cron: '0 20 15-31 * *'   # UTC 20:00 = KST 익일 05:00, 매월 16일~월말
  workflow_dispatch:
    inputs:
      limit:
        # 스모크 테스트용 — 소수 종목만 조회해 1분 안에 API 생사를 판별한다(2026-08-07 신설).
        # 전량은 ~60분·3.5K 콜이라, "지금도 같은 증상인가" 를 확인하려고 매번 태울 수 없다.
        # 🚨 limit>0 이면 커밋·발행을 건너뛴다 — 부분 결과가 정식 스냅샷으로 올라가지 않도록.
        description: '조회 종목 수 상한 (스모크 테스트). 0 또는 미입력 = 전량 + 커밋/발행'
        required: false
        default: '0'
        type: string

concurrency:
  group: verity-nps-employment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Probe source month
        if: ${{ github.event_name == 'schedule' }}
        id: probe
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: |
          remote_month="$(python api/collectors/nps_employment.py --source-latest)"
          local_month="$(python -c 'import json; print((json.load(open("data/nps_employment.json")).get("_meta") or {}).get("data_ym_latest") or "")')"
          echo "원천 최신월=${remote_month} · 산출물 최신월=${local_month}"
          if [[ -z "$local_month" || "$remote_month" > "$local_month" ]]; then
            echo "needs_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect NPS employment
        if: ${{ github.event_name == 'workflow_dispatch' || steps.probe.outputs.needs_full == 'true' }}
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          NPS_EMP_LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: python api/collectors/nps_employment.py

      - name: Commit data
        # 스모크 테스트(limit>0)는 부분 결과라 정식 스냅샷으로 커밋하지 않는다.
        if: ${{ (github.event.inputs.limit || '0') == '0' && (github.event_name == 'workflow_dispatch' || steps.probe.outputs.needs_full == 'true') }}
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin main || true
          git add data/nps_employment.json
          git add data/nps_employment_history.jsonl
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "📊 nps_employment 월간 수집 $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push origin main

      - name: Publish (VERITY-data + Vercel Blob)
        if: ${{ (github.event.inputs.limit || '0') == '0' && (github.event_name == 'workflow_dispatch' || steps.probe.outputs.needs_full == 'true') }}
        continue-on-error: true
        uses: ./.github/actions/publish-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.VERITY_DATA_PAT }}
          blob_token: ${{ secrets.VERCEL_BLOB_TOKEN }}
