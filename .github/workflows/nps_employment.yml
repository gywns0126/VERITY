name: nps-employment

# 상장사 고용 동향 (국민연금 가입 사업장) — 공단 갱신 = 매월 15일 이후
# 데이터 = 최근 1년 창만 제공 → 월 1회 스냅샷 누적이 시계열 자산 (history.jsonl)
# 콜 ≈ 3.5K/run (dev 한도 10K/일 내)
#
# 🚨 2026-08-07 사고 대응: 월 1회 단발이라 그 한 번이 실패하면 **한 달을 통째로 잃는다**.
#   2026-07-15 정기 run 이 90분 timeout 으로 죽어 6월분을 못 받았고, 데이터가 5월에
#   한 달간 묶여 있었다(PM 지적 "아직도 5월달 기준임"). 세 갈래로 고침:
#     ① timeout 90 → 180분 (실측이 90분을 넘겼는데 주석은 "~30분" 이었다)
#     ② 워커 8 → 20 (5 tx/s, 한도 30tx/s 의 1/6)
#     ③ 16·20·24일 3회 — 수집기가 종목별 기준월을 병합하므로 이미 최신이면 재수집분이
#        그대로 덮어써 no-op 에 가깝고, 앞 회차가 죽어도 같은 달 안에 만회한다.

on:
  schedule:
    - cron: '0 20 15 * *'   # UTC 15일 20:00 = KST 16일 05:00 (주 회차)
    - cron: '0 20 19 * *'   # KST 20일 05:00 — 1차 만회
    - cron: '0 20 23 * *'   # KST 24일 05:00 — 2차 만회
  workflow_dispatch:

concurrency:
  group: verity-nps-employment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Collect NPS employment
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: python api/collectors/nps_employment.py

      - name: Commit data
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin main || true
          git add data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "📊 nps_employment 월간 수집 $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push origin main

      - name: Publish (VERITY-data + Vercel Blob)
        continue-on-error: true
        uses: ./.github/actions/publish-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.VERITY_DATA_PAT }}
          blob_token: ${{ secrets.VERCEL_BLOB_TOKEN }}
