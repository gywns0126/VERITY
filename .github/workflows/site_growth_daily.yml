# Site Growth measurement — feedback_site_growth_is_core 정합 단일 SOT cron
#
# 매일 KST 01:00 (UTC 16:00) 1회 실행
#   - Supabase live_visitors → 직전 24h distinct session_id
#   - Supabase profiles → 누적 row count
#   - data/metadata/site_growth.jsonl append (idempotent — 같은 날 1 entry)

name: Site Growth Daily

on:
  schedule:
    # KST 01:00 = UTC 16:00. 매일.
    - cron: '7 16 * * *'
  workflow_dispatch:

# Node.js 24 강제 — 2026-06-02 GitHub Node 20 deprecation 대비 (2026-05-07)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
# 🚨 2026-08-11 그룹 분리 — 기아 회피. 이 워크플로는 verity-data-write 의 다른 구성원과
#   **공유 산출물이 0** 이다(정적 감사: git add 경로 교집합 없음). 그런데 같은 그룹에 있어
#   daily_analysis_full(114분)이 락을 쥐고 daily_analysis(매시간)가 도착하는 동안
#   pending 슬롯 1칸에서 계속 축출됐다. 상세 = [[feedback_concurrency_starvation_pending_slot]].
#   경량군끼리는 직렬화를 유지한다(전부 ≤13분, 미발견 겹침 대비 안전 마진).
  group: verity-data-write-light
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Measure site growth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/measure_site_growth.py

      - name: Commit & push
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/metadata/site_growth.jsonl 2>/dev/null || true
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git diff --staged --quiet || git commit -m "📈 site_growth ${DATE}"
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash -X theirs origin "$BRANCH" && git push origin "$BRANCH"; then
              break
            fi
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
