        # 분석-크리티컬 경로를 flaky schedule 에서 분리: 읽기 직전 inline 갱신 →
        # main.py fast-path HIT 보장. 실패해도 main.py 가 stale snapshot 으로 degrade
        # (commit 9c505e439) → continue-on-error 안전. macro = KIS 무관 (RULE 1 N/A).
        continue-on-error: true
        env:
