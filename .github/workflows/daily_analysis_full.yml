name: Stock Analysis Pipeline (Full & Periodic)

# Full/Full_US/periodic_* 모드 전용 워크플로.
# realtime/quick cron(daily_analysis.yml)과 concurrency group 을 분리해서
# 5~10분마다 도는 경량 cron 이 35분짜리 full 실행을 cancel 하지 못하게 한다.

on:
  schedule:
    # 장 마감 full 분석 (KST 16:50 = UTC 07:50), 월~금
    # 🚨 2026-08-07 — 07:07 → 07:50 이동. universe_scan(06:30 시작)이 같은 concurrency
    #   그룹(verity-data-write)에서 49~66분(중앙 55분) 돌아 07:07 슬롯을 항상 침범했다.
    #   GitHub 는 그룹당 **대기 슬롯을 하나만** 유지하므로, 대기 중에 제3의 워크플로가
    #   도착하면 밀려나 취소된다. 실측 2026-08-07:
    #     Universe Scan 06:30→07:24 점유 · daily_full 07:07 대기 진입 ·
    #     Export Trade 07:16 도착 → daily_full **취소(job 0개, 실행된 적 없음)**
    #     = 당일 KST 16:07 장 마감 전체 분석 누락.
    #   설계 주석(universe_scan.yml)은 "37분 일찍 시작"으로 ~35분 소요를 가정했는데
    #   실제가 55분으로 드리프트했다.
    #   부수 효과로 정확성도 개선된다 — 07:07 은 universe_scan 미완이라 어제 스냅샷을
    #   읽어 max_stale 2h 초과 → 느린 인라인 폴백이었다. 07:50 이면 26분 stale = fast path.
    #   ⚠️ vercel-api/api/cron/dispatch_pulse.py 의 시각 매핑도 **함께** 옮겨야 한다
    #     (Vercel fallback 이 옛 시각으로 쏘면 같은 충돌이 재현된다).
    - cron: '50 7 * * 1-5'
    # 미장 마감 full 분석 KST 06:30 (UTC 21:30), 화~금
    # 2026-05-18 fix: 옛 '2-6' (Tue-Sat UTC) 결함 — Sat UTC = KST Sun 06:30 = US 미장
    # 휴장 + KRX 일요일 휴장 = 분석할 세션 0 + KRX 빈 JSON 무한 fail. cron 자체 false trigger.
    # '2-5' (Tue-Fri UTC) = 각각 Wed/Thu/Fri/Sat KST 06:30 = 정상 post-US 마감 분석.
    - cron: '30 21 * * 2-5'
    # 주간 리포트: 매주 토요일 KST 09:00 (UTC 00:00)
    - cron: '7 0 * * 6'
    # 월간 리포트: 매월 1일 KST 09:00 (UTC 00:00)
    - cron: '7 0 1 * *'
    # 분기 리포트: 1/4/7/10월 2일 KST 10:00 (UTC 01:00)
    - cron: '7 1 2 1,4,7,10 *'
    # 반기 리포트: 1/7월 3일 KST 10:00 (UTC 01:00)
    - cron: '7 1 3 1,7 *'
    # 연간 리포트: 1월 4일 KST 10:00 (UTC 01:00)
    - cron: '7 1 4 1 *'
  # 2026-05-18 — Vercel Cron fallback (GitHub Actions schedule silent miss 회피).
  # vercel-api/api/cron/dispatch_pulse.py 가 매분 KST 16:07 / 06:30 시각 매핑 → repository_dispatch.
  repository_dispatch:
    types:
      - daily_analysis_full
  workflow_dispatch:
    inputs:
      mode:
        description: '분석 모드 (full / full_us / periodic_daily / periodic_weekly / periodic_monthly / periodic_quarterly / periodic_semi / periodic_annual)'
        required: false
        default: 'full'
        type: string
      verity_mode:
        description: 'VERITY_MODE (LLM 호출 정책). manual dispatch default = staging (cost 격리). 운영 검증 필요시 prod.'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - prod
          - dev

# Node.js 24 강제 — 2026-06-02 GitHub Node 20 deprecation 대비 (2026-05-07)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # 🚨 RULE 1 — GH Actions 단일 발급원 (PM 2026-05-31). 발급 직후 Supabase publish (Railway/Vercel 소비).
  KIS_SHARED_TOKEN: "1"
  # 🚨 RULE 1 이중발급 fix (2026-08-02, PM 승인 option1) — 이 워크플로는 발급 금지, 공유 토큰 읽기 전용.
  #   7/21·6/26 daily_realtime×daily_analysis(_full) 동시 발급 실증. 발급자 = kis_token_refresh(주)+daily_realtime(백업)만.
  KIS_CACHE_ONLY: "1"

permissions:
  contents: write

# WARN-17: data/* 쓰기 워크플로 단일 그룹 직렬화 (realtime/quick/bond_etf/export_trade 공유).
# cancel-in-progress: false → full/realtime 이 동시에 매치되면 큐잉.
concurrency:
  group: verity-data-write
  cancel-in-progress: false

jobs:
  # ── 중복 트리거 가드 (2026-08-15 신설) ──────────────────────────────────────
  # 🚨 이 워크플로는 트리거가 둘이다 — GH `schedule` + Vercel `repository_dispatch`.
  #   후자는 "GH schedule silent miss 회피" fallback 인데(2026-05-18), GH 가 정상 발화하면
  #   **둘 다 돈다**. fallback 에 "본편이 이미 돌았나" 확인이 없었다.
  #
  #   실측 (2026-08-15, GitHub API 표본 60건 / 20일):
  #     · 중복 쌍 16건. 예) 08-14T21:30 dispatch(실패 110분) + 21:49 schedule(성공 146분)
  #       = 슬롯 하나에 256분. 두 번째는 concurrency 큐에서 96분 대기 후 시작했다.
  #     · universe_scan 도 같은 구조로 4건 (양쪽 다 성공 = 순수 낭비). 그쪽은 후속 과제.
  #
  #   🚨 설계상 중요한 점 — 중복이 우연히 재시도 역할을 했다. 08-14 는 dispatch 가 실패하고
  #     schedule 이 성공해 그날 산출물을 건졌다. 그래서 이 가드는 **선행이 성공했을 때만**
  #     건너뛴다. 선행이 실패·취소면 후행이 그대로 재시도로 남는다.
  #     workflow-level concurrency(verity-data-write, cancel-in-progress:false) 가 직렬화하므로
  #     이 job 이 시작하는 시점엔 선행 run 의 결론이 이미 나 있다.
  #
  #   fail-open 원칙: 조회 실패·자기 run 미발견·판단 불가 = **무조건 실행**. 슬롯을 비우는 것이
  #     이 fallback 이 막으려던 사고이므로, 의심스러우면 도는 쪽이 맞다.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout (가드 스크립트)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 같은 슬롯 성공분 확인
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF: ${{ github.run_id }}
          WINDOW_MIN: '120'   # 관측 중복 간격 18.9~88.8분. 정규 슬롯 간격 13.7h 이상이라 안전
        run: |
          set -uo pipefail
          # 수동 실행은 오퍼레이터 의도 — 가드 미적용
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"; echo "수동 실행 — 가드 미적용"; exit 0
          fi
          JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/daily_analysis_full.yml/runs?per_page=30" 2>/dev/null) || JSON=""
          if [ -z "$JSON" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"; echo "API 조회 실패 — fail-open 실행"; exit 0
          fi
          # 🚫 판정 로직을 여기 인라인으로 되돌리지 말 것 — YAML 블록 스칼라 들여쓰기가 깨져
          #    워크플로가 통째로 무효가 된다(2026-08-15 실측). 스크립트 파일로 유지한다.
          OUT=$(printf '%s' "$JSON" | python3 scripts/ci/duplicate_run_guard.py)
          echo "$OUT"
          echo "run=$(printf '%s' "$OUT" | grep -oE '^run=[01]$' | tail -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"

  analyze:
    needs: guard
    if: needs.guard.outputs.run == '1'
    runs-on: ubuntu-latest
    # 🚨 2026-07-16 안전변 120 → 150. 평일 baseline 이 ~100~120분(고정, 크립 아님 — 프로파일 확인)
    #   이라 120 천장에 붙어 있어, 외부 API 무제한 호출이 가끔 멈추면 슬롯이 천장을 넘어 SIGTERM.
    #   실사고: 7/16 Gemini 리포트요약 19분 행(→ 동봉 report_summarizer 타임아웃 캡으로 근본 수리),
    #   7/14 DART 재시도 폭주. 150 은 응급 헤드룸일 뿐 — 근본은 무제한 외부호출 캡.
    #
    # 🚨 옛 조항: "150 초과 시 이 값을 더 올리지 말 것(무료 분 소진·크립 은폐)."
    #   2026-08-13 PM 승인으로 **이번 1회 예외**. 지우지 않고 남긴다 — 왜 뒤집었는지가 기록돼야 한다.
    #
    #   뒤집은 이유: 그 조항은 150분이 충분하다는 전제 위에 있었는데 전제가 깨졌다.
    #     · 08-10 전 상장사 리포트 배선(7e311c844) → 리포트 빌드 0.1분 → 52.4분
    #     · Run analysis 는 별개로 +6.9분/일 증가 중
    #     → 정상 동작만으로 147.6분(08-12). 여유 1.6%.
    #   결과적으로 "크립 은폐 방지" 조항이 **매일 147분치 산출을 버리는** 상태를 만들었다.
    #   커밋·발행 step 이 timeout 에 잘려 market_warnings·securities_lending 이 08-08 에 정지.
    #
    #   옛 조항의 두 근거에 대한 현재 판정:
    #     · 무료 분 소진 → 해당 없음. 이 repo 는 PUBLIC 이라 Actions 무료 무제한(CLAUDE.md 하이브리드).
    #     · 크립 은폐   → 상쇄됨. GitHub 이 step 별 시각을 이미 기록하므로 숫자로 감시한다:
    #         gh api "repos/gywns0126/VERITY/actions/runs/<ID>/jobs" → steps[].started_at/completed_at
    #       (kickoff 메모리에 조회 명령 등재. 은폐가 아니라 계측 위에서 올리는 것이다.)
    #
    #   🚨 240 은 종점이 아니다. +6.9분/일이면 약 13일 뒤 다시 닿는다. 근본은 파이프라인 분해이며,
    #     리포트 빌드 step 은 recommendations.json(같은 run 의 Run analysis 산출) 의존이라
    #     단순 분리가 불가함을 확인했다(2026-08-13). 다음에 또 닿으면 올리지 말고 분해를 논의할 것.
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # B-3: brain_evolution.collect_evolution_log 가 git log 30 commit 분석 필요
          fetch-depth: 100
          # 🚨 2026-07-13 — pin 된 SHA 가 아니라 job 시작 시점의 main tip 을 받는다.
          #   스케줄 run 은 트리거 시각의 SHA(github.sha)에 고정된다. universe_scan(UTC 06:30 시작)과
          #   이 워크플로(UTC 07:07)는 같은 concurrency group(verity-data-write, cancel-in-progress:false)
          #   이라 큐로 직렬화되지만, checkout 이 pin 된 SHA 를 쓰면 스캔이 그 뒤에 커밋한 신 스냅샷을
          #   못 본다. 실사고 2026-07-13(월): scan 이 43분 걸려 07:13:50 커밋(ee9761bfe) → daily_analysis
          #   는 07:07:50 의 SHA(c413cf5a3)를 체크아웃 → 금요일 candidates(68.8h) → 26h 게이트 abort
          #   → 하위 빌더 24개 전부 skip. (스캔 소요가 35분→43분으로 늘며 37분 오프셋을 추월)
          #   ref=main → 큐 대기 후 실행되므로 스캔 커밋이 반드시 포함된다. 요일 무관하게 경합 소멸.
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 현재 날짜 (KST)
        id: date
        run: echo "today=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: KIS 토큰 캐시 복원 (하루 1회 재발급 보장)
        uses: actions/cache@v4
        with:
          path: ~/.cache/verity_kis_token.json
          key: kis-token-v2-${{ runner.os }}-${{ steps.date.outputs.today }}
          restore-keys: |
            kis-token-v2-${{ runner.os }}-

      - name: Check optional trade/patent API secrets
        env:
          KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY || vars.KIPRIS_API_KEY }}
          KIPRIS_ACCESS_KEY: ${{ secrets.KIPRIS_ACCESS_KEY || vars.KIPRIS_ACCESS_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY || vars.PUBLIC_DATA_API_KEY }}
        run: |
          if [ -z "$KIPRIS_API_KEY" ] && [ -z "$KIPRIS_ACCESS_KEY" ]; then
            echo "::warning::KIPRIS: KIPRIS_API_KEY 또는 KIPRIS_ACCESS_KEY 없음"
          fi
          if [ -z "$PUBLIC_DATA_API_KEY" ]; then
            echo "::warning::관세청: PUBLIC_DATA_API_KEY 없음"
          fi
          KRX_API_KEY="${{ secrets.KRX_API_KEY || vars.KRX_API_KEY }}"
          if [ -z "$KRX_API_KEY" ]; then
            echo "::warning::KRX: KRX_API_KEY 없음 → docs/KRX_OPEN_API_SETUP.md"
          fi

      - name: Ensure Korean font for PDF
        run: |
          mkdir -p api/reports/fonts
          if [ ! -f api/reports/fonts/NanumGothic.ttf ]; then
            curl -sL -o api/reports/fonts/NanumGothic.ttf \
              "https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Regular.ttf"
            curl -sL -o api/reports/fonts/NanumGothicBold.ttf \
              "https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Bold.ttf"
          fi

      - name: Detect periodic schedule
        id: detect_mode
        run: |
          CRON="${{ github.event.schedule }}"
          MANUAL="${{ github.event.inputs.mode }}"
          # 🚨 2026-08-20 — Vercel dispatch 가 실어 보내는 모드. 종전에는 이 경로가 없어
          #   dispatch 트리거 시 CRON="" → 모든 elif 불일치 → else → mode=full 로 흘렀다.
          #   KST 06:30(UTC 21:30) 슬롯은 full_us(미장 전체)여야 하는데 매번 full 이 되어
          #   미장 수집이 상위 10개로 잘렸다 — 실측 2026-08-20 06:30 run
          #   `[5.71] 미장 데이터 수집 — 상위 10개`. Finnhub 커버 29/49 의 원인이다.
          #   🚨 GH schedule 은 이제 사실상 안 쓰인다(dispatch 가 먼저 잡는다). 그래도 CRON
          #   분기는 남긴다 — dispatch 가 죽었을 때의 fallback 이고, 지우면 그 경로가 조용히
          #   full 로 떨어진다.
          DISPATCH_MODE="${{ github.event.client_payload.mode }}"
          DAY_OF_MONTH=$(TZ=Asia/Seoul date +%d)
          if [ -n "$MANUAL" ]; then
            echo "mode=$MANUAL" >> $GITHUB_OUTPUT
          elif [ -n "$DISPATCH_MODE" ]; then
            echo "mode=$DISPATCH_MODE" >> $GITHUB_OUTPUT
          elif [ "$CRON" = "7 1 4 1 *" ]; then
            echo "mode=periodic_annual" >> $GITHUB_OUTPUT
          elif [ "$CRON" = "7 1 3 1,7 *" ]; then
            echo "mode=periodic_semi" >> $GITHUB_OUTPUT
          elif [ "$CRON" = "7 1 2 1,4,7,10 *" ]; then
            echo "mode=periodic_quarterly" >> $GITHUB_OUTPUT
          elif [ "$CRON" = "7 0 1 * *" ] || ([ "$CRON" = "7 0 * * 6" ] && [ "$DAY_OF_MONTH" = "01" ]); then
            echo "mode=periodic_monthly" >> $GITHUB_OUTPUT
          elif [ "$CRON" = "7 0 * * 6" ]; then
            echo "mode=periodic_weekly" >> $GITHUB_OUTPUT
          elif [ "$CRON" = "50 7 * * 1-5" ] || [ "$CRON" = "7 7 * * 1-5" ]; then
            # 🚨 2026-08-07 — cron 문자열 매칭이라 스케줄을 옮기면 여기가 같이 안 바뀌면
            #   else 로 흘러간다(현재 else 도 full 이라 무해했지만, periodic 을 옮길 땐 치명적).
            #   신·구 둘 다 인정 — 이전 스케줄로 예약된 run 이 남아 있을 수 있다.
            echo "mode=full" >> $GITHUB_OUTPUT
          elif [ "$CRON" = "30 21 * * 2-5" ]; then
            echo "mode=full_us" >> $GITHUB_OUTPUT
          else
            echo "mode=full" >> $GITHUB_OUTPUT
          fi

      # KIS [C] 보강 (commit bac4ec2 재활성화 조건) —
      # KIS 토큰을 분석 시작 전에 발급하고 daily lock 을 즉시 push.
      # 기존 흐름: analysis step (28분) 안에서 발급 → 끝나야 commit/push 발생.
      #           그 사이 KIS Token Refresh cron 이 stale lock 보고 재발급 위험 (5/3 사고 원인).
      # 본 step: lock 파일을 ~수초 안에 origin 에 push → 다음 cron 의 fresh checkout 이 즉시 인지.
      - name: KIS preflight (issue + immediate lock push)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_OPENAPI_BASE_URL: ${{ secrets.KIS_OPENAPI_BASE_URL || vars.KIS_OPENAPI_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KIS_APP_KEY" ]; then
            echo "[KIS preflight] secrets 미설정 — skip"
            exit 0
          fi
          python - <<'PYEOF'
          import sys, os
          sys.path.insert(0, os.getcwd())
          try:
              from api.trading.kis_broker import KISBroker
              broker = KISBroker()
              if not broker.is_configured:
                  print("[KIS preflight] 미설정 — skip")
                  sys.exit(0)
              # 2026-05-13 자정 race fix: date 비교 → 시각 기반 interval
              # 2026-05-29 RULE 1 정정: 23h → 24h (5/27 00:08+23:08 / 5/28 22:11 매일 알림 사고)
              if broker._is_recently_issued(hours=24):
                  print("[KIS preflight] 24h 이내 발급 — skip")
                  sys.exit(0)
              # force_refresh=False — broker 24h interval 가드 (자정 race 차단) 작동
              token = broker.authenticate(force_refresh=False)
              print(f"[KIS preflight] 발급 완료: {token[:8]}***")
          except Exception as e:
