        continue-on-error: true
        run: python -c "from api.observability.excursion_trail import build; s=build(); print('[excursion]', 'N=' + str(s['n_episodes']), 'MFE', s['mfe']['mean'], 'MAE', s['mae']['mean'], '·', ' / '.join(s['labels']))"

      - name: 공매도 규칙 사후 수익률 관측 (관측 전용, 점수 입력 0)
        # 2026-08-06 — PREREG_SHORT_SALE_AUTO_AVOID_2026_08_06 (PM 승인 안 (가)) 집행.
        # 공매도 auto_avoid 는 등급 산식 최강 조치(즉시 AVOID)인데 걸러낸 종목의 사후
        # 수익률을 기록하지 않아 규칙이 옳은지 판정할 데이터가 0 이었다. 임계·강도를
        # 논하기 전에 관측이 먼저다. 임계·측정 지표는 무변경 — 여기서 판정하지 않는다.
        # 🚨 결측을 clean 과 분리 집계 · KR(흐름)·US(포지션) 합산 금지 · 종목 단위 N.
        # 산출 data/short_sale_trail.jsonl + short_sale_summary.json — 다음 step
        # git add data/ (broad) 자동 포함 = RULE 4. graceful exit 0. 수익률은 KR 전용.
        continue-on-error: true
        run: python -c "from api.observability.short_sale_trail import build; s=build(); k=s['KR']['auto_avoid']['fwd_20d']; print('[short_sale]', 'obs=' + str(s['n_observations']), 'auto_avoid 종목N=' + str(k['n_tickers']), '20d', k['mean'], '·', ' / '.join(s['labels']))"

      - name: 측정 오염 자동 검출 (원장 정합·키 커버리지·단위 스케일)
        # 2026-08-05 — 8/4~5 감사에서 확정 결함을 실제로 잡아낸 세 대조를 상시화.
        # 사람이 478 모듈을 훑는 방식은 끝나지 않는다(그날 커버리지 3%). 검출력 실증:
        #   유령 매도 58건 · 죽은 채점 키 10종 · 통화 혼재 5종 — 전부 이 검사가 재현.
        # 🚨 점수 입력 0 (관측·신고 전용). 산출 data/measurement_audit.json + trail jsonl,
        # 다음 step git add data/ (broad) 자동 포함 = RULE 4. graceful exit 0.
        continue-on-error: true
        run: python -c "from api.observability.measurement_audit import run; r=run('.'); print('[measurement_audit]', r['status'], '· 신규:', r['failing'], '· KNOWN:', r['known_unresolved'])"

      - name: 측정 감사 신규 검출 telegram push
        # 🚨 2026-08-06 — 경보가 로그에만 찍히면 아무도 읽지 않는다. 실제로 통화 혼재 3건이
        # 매일 신고되고 있었는데 8/6 PM 질문("자동 크론 만들었잖아? 아직도 3%야?")으로
        # 파다가 발견했다. status FAIL(=baseline 초과=신규)일 때만 발송, KNOWN/OK 는 침묵.
        # **알림 0건이 정상 baseline** — 1건이라도 오면 그날 새로 생긴 것이다.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_QUIET_HOURS_ENABLED: ${{ vars.TELEGRAM_QUIET_HOURS_ENABLED || '1' }}
        run: python scripts/push_measurement_audit_telegram.py

      - name: B3 F-Score/Accrual shadow IC trail (관측 전용, brain-input 0)
        # 2026-08-05 — PREREG_FSCORE_ACCRUAL_B3_2026_07_12 (PM 승인 7/12 "굿임 고고") 집행.
        # recommendations.json 생성 후 실행: 당일 단면 관측 → eval 도달분 채점 → IC/ICIR 집계.
        # 🚨 검증축 분리 — 어떤 점수에도 입력되지 않는다(§3). 산출 = data/fscore_ic_shadow.jsonl
        # + fscore_ic_history.jsonl, 다음 step git add data/ (broad) 자동 포함 = RULE 4.
        # forward-only(과거 backfill 금지 = survivorship 무편의 조건 §6). graceful exit 0.
        continue-on-error: true
        run: python scripts/fscore_shadow_trail.py

      - name: Pool rotation 주간 판정 (R6 v0 — 보고서만, 집행 없음)
        # 2026-08-04 PREREG_POOL_ROTATION — 토요 KST 만 실 판정 (스크립트 자체 게이트, 평일 no-op).
        # 산출 = data/pool_rotation_report.json + pool_rotation_log.jsonl append — 다음 step
        # git add data/ (broad) 자동 포함 = RULE 4. publish allowlist 미등재 = 비공개 (RULE 7).
        # v0 = 보고서만, 집행 = PM 확인 후 수동. graceful: 입력 결손 exit 0.
        continue-on-error: true
        run: python scripts/pool_rotation_report.py

      - name: 손절 캡 변경 사후 감시 (사전등록 §4·§5)
        # 2026-08-09 PREREG_STOPLOSS_CAP — 손절 캡 −5%→−20% 의 되돌림 감시 + N=20 보고.
        # 🚨 되돌림 감시(MDD −17%)는 **매 run** 해야 한다 — 20거래를 기다리면 늦다.
        #   조건이 "20거래 **내**" 라 그 창 안에서 언제든 걸릴 수 있다.
        # 판정만 하고 자동 원복은 하지 않는다(되돌림 = PM 결정).
        # 산출 = data/metadata/stoploss_watch.json — 다음 step git add data/ (broad) = RULE 4.
        continue-on-error: true
        run: python -m api.observability.stoploss_watch

      # Tranche B dual-write (#9 봉인) — daily_analysis.yml 동일 스텝 (설계 주석은 그쪽 참조).
      - name: Private data sync (Tranche B)
        if: always()
        continue-on-error: true
        env:
          PRIVATE_DATA_PAT: ${{ secrets.PRIVATE_DATA_PAT }}
        run: |
          for f in data/factor_ic_history.json data/recommendations.json data/portfolio.json; do
            if git diff --quiet -- "$f" && git diff --cached --quiet -- "$f"; then
              echo "[private_data] unchanged skip $f"
            else
              python scripts/private_data.py push "$f"
            fi
          done

      - name: Commit & push results
        # 핵심 데이터 붕괴 시 커밋 차단 (coverage_gate fail-closed) — 결함본이 repo·사이트로 안 나감. 2026-07-12.
        if: success() && steps.coverage_gate.outcome != 'failure'
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/
          HOUR_KST=$(TZ=Asia/Seoul date +%H:%M)
          MODE="${{ steps.detect_mode.outputs.mode }}"
          if [[ "$MODE" == periodic_* ]]; then
            LABEL=$(echo "$MODE" | sed 's/periodic_//')
            git diff --staged --quiet || git commit -m "📋 ${LABEL} 리포트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          else
            git diff --staged --quiet || git commit -m "📊 [${MODE}] 분석 업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d) ${HOUR_KST}"
          fi
          BRANCH="${{ github.ref_name }}"
          PUSHED=false
          # 재시도 8회 + 지터 (2026-08-06 실패 fix) — main 에 push 하는 워크플로가 56개,
          # 봇 커밋 하루 292개. 고정 간격 재시도는 여러 워크플로가 같은 리듬으로 재충돌한다.
          for i in 1 2 3 4 5 6 7 8; do
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            if git pull --rebase --autostash -X theirs origin "$BRANCH" && git push origin "$BRANCH"; then
              PUSHED=true
              break
            fi
            WAIT=$(( i * 7 + RANDOM % 15 ))
            echo "Push attempt $i failed, retrying in ${WAIT}s (jittered)..."
            sleep "$WAIT"
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::All 8 push attempts failed (main 경합) — 다음 스케줄에서 재시도"
            exit 1
          fi

      - name: 멀티배거 선별 리스트 갱신 (채점 반영 · 알파콘솔 전용)
        # 🚨 여기가 등급이 붙는 시점이다. universe_scan 쪽 빌드는 승격 직후라 아직
        #   미채점(waiting)이고, 이 run 의 portfolio.json 이 brain_score·grade 를 갖는다.
        #   업로드는 아래 스텝(전체 업로드)이 이어받으므로 생성만 한다.
        # 실패해도 발행을 막지 않는다 — 부차 산출물이다.
        if: always() && steps.coverage_gate.outcome != 'failure'
        run: python3 api/builders/multibagger_picks_builder.py || echo "[multibagger_picks] skip"

      - name: Upload operator full data to private Supabase Storage
        # VERITY↔AlphaNest 분리 Stage 1 (2026-07-23): full portfolio.json → verity-reports private bucket.
        # /api/admin(?type=portfolio_full, authed=is_admin/토큰) 이 서빙 → 오퍼레이터 콘솔이 공개 blob 대신
        # 이 authed 경로로 full fetch. 공개 blob(sanitize 예정, Stage 3)과 별도 = 크라운주얼 사설화.
        # 실패해도 발행 계속(admin.py fallback=공개 blob). SUPABASE_SERVICE_ROLE_KEY 기존 등록.
        if: always() && steps.coverage_gate.outcome != 'failure'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/upload_operator_data_to_supabase.py

      - name: Publish hot data to VERITY-data
        # Phase A: dual-write — main 에도 commit (위), gh-pages 에도 force-orphan push.
        # 검증 후 Phase B 에서 fetch URL 마이그레이션, Phase C 에서 main commit 제거.
        # 핵심 데이터 붕괴 시 발행 차단 (coverage_gate fail-closed) — 결함 Blob 이 CDN 으로 안 나감. 2026-07-12.
        if: always() && steps.coverage_gate.outcome != 'failure'
        uses: ./.github/actions/publish-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.VERITY_DATA_PAT }}
          blob_token: ${{ secrets.VERCEL_BLOB_TOKEN }}
