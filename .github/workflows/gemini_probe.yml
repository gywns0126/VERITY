name: Gemini Grounding Probe (dispatch-only, 실험)

# Gemini 구글 검색 그라운딩 거시 정보 품질 1회 실험 (PM 2026-08-03). LLM 1콜 ~$0.01.
# dispatch 전용 — cron 없음(silent skip 무관), 커밋 0(git add 무관), KIS 무관(RULE 1),
# push trigger 없음(RULE 2). 판정 후 유지 또는 제거.

on:
  workflow_dispatch: {}

permissions:
  contents: write   # 장부 커밋용(산출물은 gitignore 봉인)

concurrency:
  group: verity-gemini-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gemini_grounding_probe.py

      - name: Commit LLM cost ledger (RULE 4 — 산출물은 gitignore 로 봉인 유지)
        if: always()
        run: |
          # 🚨 이 워크플로의 산출물(크라운주얼)은 .gitignore 로 커밋이 원천 차단되어 있다.
          #   여기서 커밋하는 것은 **비용 장부뿐** — 가장 비싼 LLM 호출이 관측에서 빠지던
          #   사각지대 해소(2026-08-06). 장부 미add 시 rebase 거부 사고도 함께 예방(RULE 4).
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/metadata/llm_cost.jsonl 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "💰 llm_cost 장부 — 그라운딩 프로브"
          for i in 1 2 3 4 5 6; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin main && git push origin main; then exit 0; fi
            sleep $(( i * 7 + RANDOM % 15 ))
          done
          echo "::warning::장부 push 실패 — 다음 run 에서 누적 재시도"
