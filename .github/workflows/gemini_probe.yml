name: Google Provider Policy Smoke (dispatch-only, no network)

# Google generation retirement guard only: no key, provider request, or paid model call.
# Dispatch-only; the script proves policy rejection without network access.

on:
  workflow_dispatch: {}

permissions:
  contents: write   # 장부 커밋용(산출물은 gitignore 봉인)

concurrency:
  group: verity-gemini-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Verify Google provider policy (no network)
        run: python scripts/gemini_grounding_probe.py
