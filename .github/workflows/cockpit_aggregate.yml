name: Cockpit Aggregate (5분 cron)

# 2026-05-27 박힘 — 1인 운영자 관제탑 Phase 0.
# PM=approved 2026-05-23 (plan §Phase 0-d).
# 11 ledger → data/metadata/cockpit_state.json 단일 SoT.
# read-only aggregate. KIS API call 0 (RULE 1 정합).
# data/metadata/ = vercel-api/ 외부 → ignoreCommand auto-skip (RULE 2 정합).

on:
  repository_dispatch:
    types: [cockpit_aggregate]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  actions: read

jobs:
  cadence:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - uses: actions/github-script@v7
        id: slot
        with:
          script: |
            const slot = context.payload.client_payload?.schedule_slot;
            if (!slot || !Number.isFinite(Date.parse(slot))) throw new Error('Invalid schedule_slot');
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'cockpit_aggregate.yml',
              branch: context.payload.repository.default_branch,
              created: `>=${slot}`, per_page: 100
            });
            const duplicate = runs.some(run => run.id < context.runId);
            core.setOutput('run', String(!duplicate));
            core.info(duplicate ? 'Slot already attempted; skip duplicate' : 'First run in slot');
  aggregate:
    needs: cadence
    if: always() && !cancelled() && (needs.cadence.result == 'skipped' || needs.cadence.outputs.run == 'true')
    runs-on: ubuntu-latest
    # Reject duplicate slots before entering the single pending-job queue.
    concurrency:
      group: verity-cockpit-aggregate
      cancel-in-progress: false
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install minimal deps
        # api.config 박은 dotenv import → python-dotenv 박음. 2026-05-27 박은 fix.
        run: pip install --quiet --no-cache-dir requests python-dotenv

      - name: Run cockpit aggregator
        run: python scripts/cockpit_aggregate.py

      - name: Run system map generator
        # 2026-06-07 — SystemMap "한눈에 보기" 구조 SoT. read-only 레포 스캔 (git ls-files
        # + line count), KIS/외부 API call 0 (RULE 1 정합). cockpit 과 별 SoT, 동반 생성.
        run: python scripts/system_map.py

      - name: Commit operator data (cockpit_state + system_map)
        id: persist
        # [[feedback_cron_commit_author_github_match]] gywns0126@gmail.com (GitHub 검증)
        # [[feedback_data_collection_verification_mandatory]] specific path commit
        # [[feedback_brain_evolution_admin_sync]] 🎯 prefix = cron blacklist (brain learn skip)
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/metadata/cockpit_state.json data/metadata/system_map.json
          if git diff --staged --quiet; then
            echo "[cockpit_aggregate] no changes"
            exit 0
          fi
          NOW_KST=$(TZ=Asia/Seoul date +"%Y-%m-%dT%H:%M")
          git commit -m "🎯 cockpit ${NOW_KST}"
          python scripts/ci/persist_cockpit_snapshot.py "$TARGET_BRANCH"

      - name: Preserve unpersisted cockpit outputs
        if: failure() && steps.persist.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-unpersisted-${{ github.run_id }}
          path: |
            data/metadata/cockpit_state.json
            data/metadata/system_map.json
          retention-days: 3
          if-no-files-found: error

      - name: Publish hot data to VERITY-data
        # 2026-05-27 박은 fix — 다른 cron 박은 publish 의존 X.
        # OperatorCockpitBar / Card 박은 부분 raw URL fetch 박은 부분 박힘 의무.
        if: success()
        uses: ./.github/actions/publish-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.VERITY_DATA_PAT }}
          blob_token: ${{ secrets.VERCEL_BLOB_TOKEN }}
