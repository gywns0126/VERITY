# Cron Health Monitor — 매일 KST 18:00 (UTC 09:00) cron 결과 자동 점검.
# 5/11 평일 schedule 부터 universe_scan + macro_collect 분리 후 첫 검증.
# 영구 자산: 매일 daily_analysis + universe_scan + macro_collect 결과 자동 텔레그램 verdict.
#
# 입력 (feedback_scheduled_routine_input_first 정합):
#   - data/metadata/runtime_load_log.jsonl
#   - data/macro_snapshot.json
#   - data/universe_candidates.json
#   - GitHub API run list (gh CLI)
# 출력: 텔레그램 (bypass_quiet, WARNING/FAIL 시만 default)

name: Cron Health Monitor

on:
  repository_dispatch:
    types: [cron_health_monitor]
  workflow_dispatch:
    inputs:
      hours:
        description: 'lookback window (시간)'
        required: false
        default: '24'
        type: string
      always_notify:
        description: 'PASS 도 push (default WARNING/FAIL 만)'
        required: false
        default: 'false'
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write   # 2026-05-17 Phase 3 — cron_health.jsonl persist main commit (옛 read)
  actions: read    # gh run list 위해

jobs:
  cadence:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - uses: actions/github-script@v7
        id: slot
        with:
          script: |
            const slot = context.payload.client_payload?.schedule_slot;
            if (!slot || !Number.isFinite(Date.parse(slot))) throw new Error('Invalid schedule_slot');
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'cron_health_monitor.yml',
              branch: context.payload.repository.default_branch,
              created: `>=${slot}`, per_page: 100
            });
            const duplicate = runs.some(run => run.id < context.runId);
            core.setOutput('run', String(!duplicate));
            core.info(duplicate ? 'Slot already attempted; skip duplicate' : 'First run in slot');
  monitor:
    needs: cadence
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.cadence.result == 'skipped' || needs.cadence.outputs.run == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: cron-health-monitor
      cancel-in-progress: false
    # requirements 설치 + 실물 검증 + monitor가 최근 실측 5분을 넘겨 commit 전 취소됨.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Resolve main after acquiring the job lock, not the queued event SHA.
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # 2026-05-11 fix: telegram.py 가 api.config import (dotenv 등) 의존. requirements.txt 일괄 설치.
        run: pip install -r requirements.txt

      - name: Run freshness shadow monitor (관측-only, 알람 없음)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 2026-06-26 신설 — SLA 매니페스트 데이터주도 모니터 SHADOW 롤아웃.
        # 텔레그램·severity 무관여, data/metadata/freshness_observations.jsonl 에만 관측 append.
        # 실 CI run 무오발 검증 후 알람 flip (별도 단계). monitor 앞 배치 = P0 exit 무관 항상 실행.
        run: python scripts/freshness_shadow_monitor.py || echo "shadow monitor 실패(무해)"

      - name: Build public freshness board
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 2026-07-07 신설 — 신선도 SLA 공개 board (나박 대응 잔여 큐).
        # shadow monitor 와 동일 헬퍼로 판정 → data/freshness_board.json 화이트리스트 발행.
        # crypto_collect 30분 사이클 publish-data 가 main HEAD 에서 Blob 반영.
        run: python api/builders/freshness_board_builder.py || echo "board build 실패(무해)"

      - name: 발행 후 실물 검증 (P2 — 배달 채움율 + CDN age)
        # 2026-07-12 신설 — 업로드된 실제 Blob 재fetch 해 핵심 배수(PER/PBR) 채움율 단언 + CDN age 수집.
        # 발행 성공≠배달 정합 갭 감시. 결과 = data/metadata/publish_verify.json(+jsonl). 외부호출 = Blob GET only.
        # graceful — 일시 네트워크 실패 무해(다음 시각 재측정). || echo = monitor/commit step 항상 실행.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_verify.py || echo "publish_verify 실패(무해, 다음 시각 재측정)"

      - name: 데이터-헬스 집계 (관리자 감시 SoT)
        # 2026-07-12 신설 — 가드 HOLD + 배달검증 + 커버리지 회귀 + 신선도를 data/metadata/data_health.json 단일 SoT 로.
        # 텔레그램 대신 관리자 사이트 컴포넌트가 읽을 피드. read-only 집계(판정·수정 0, RULE 7).
        run: python -m api.builders.data_health_builder || echo "data_health 집계 실패(무해)"

      - name: Run health monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_QUIET_HOURS_ENABLED: "0"   # bypass_quiet
        run: |
          HOURS="${{ github.event.inputs.hours || '24' }}"
          ALWAYS="${{ github.event.inputs.always_notify }}"
          ARGS="--hours $HOURS --notify"
          if [ "$ALWAYS" = "true" ]; then
            ARGS="$ARGS --always-notify"
          fi
          python scripts/cron_health_monitor.py $ARGS

      - name: Check US financial automatic delivery
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_QUIET_HOURS_ENABLED: "0"
        run: python scripts/us_financials_schedule_monitor.py --notify

      - name: Preserve prepared health outputs
        # Preserve before Git transport so a later timeout/cancellation cannot lose this run.
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: health-prepared-${{ github.run_id }}
          path: |
            data/metadata/cron_health.jsonl
            data/metadata/freshness_observations.jsonl
            data/freshness_board.json
            data/metadata/publish_verify.json
            data/metadata/publish_verify.jsonl
            data/metadata/data_health.json
            data/metadata/us_financials_schedule_health.json
          retention-days: 3
          if-no-files-found: error

      - name: Commit cron_health.jsonl
        id: persist
        # 2026-05-17 Phase 3 audit fix — cron_health_monitor 결과 persist.
        # 옛 구현 = 텔레그램 push 만 + stdout 출력 휘발 → 운영자 과거 trend 추적 불가.
        # 2026-05-30 fix — monitor step 의도된 exit 1 (P0 시그널) 후 commit step skipped 결함.
        # if: success() || failure() = cancelled 제외 항상 실행 → P0 시그널 후에도 jsonl persist.
        # 5/26~5/30 5일 연속 commit skip (88 run) repo cron_health.jsonl 3일 stale 학습.
        if: success() || failure()
        timeout-minutes: 3
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          for path in \
            data/metadata/cron_health.jsonl \
            data/metadata/freshness_observations.jsonl \
            data/freshness_board.json \
            data/metadata/publish_verify.json \
            data/metadata/publish_verify.jsonl \
            data/metadata/data_health.json; do
            test -f "$path" || { echo "::error::Missing health output: $path"; exit 1; }
            git add -- "$path"
          done
          if [ -f data/metadata/us_financials_schedule_health.json ]; then
            git add -- data/metadata/us_financials_schedule_health.json
          fi
          git diff --staged --quiet && echo "no changes" && exit 0
          TIME_KST=$(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M)
          git commit -m "🔔 cron_health ${TIME_KST}"
          python scripts/ci/persist_health_snapshot.py "$TARGET_BRANCH"
