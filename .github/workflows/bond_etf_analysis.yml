name: Bond & ETF Analysis

on:
  schedule:
    # 평일 KST 07:00 — 채권 시황 (장 시작 전 FRED/KRX 업데이트)
    - cron: '7 22 * * 0-4'
    # 평일 KST 18:30 — ETF 마감 수익률
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (bonds / etfs / all)'
        required: false
        default: 'all'
        type: string

# Node.js 24 강제 — 2026-06-02 GitHub Node 20 deprecation 대비 (2026-05-07)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  # WARN-17: data/* 쓰기 워크플로 단일 그룹 직렬화 (daily_analysis/export_trade 와 공유)
  group: verity-data-write
  cancel-in-progress: false

jobs:
  bond-etf:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine run mode
        id: detect_mode
        run: |
          CRON="${{ github.event.schedule }}"
          MANUAL="${{ github.event.inputs.mode }}"
          if [ -n "$MANUAL" ]; then
            echo "mode=$MANUAL" >> $GITHUB_OUTPUT
          elif [ "$CRON" = "7 22 * * 0-4" ]; then
            echo "mode=bonds" >> $GITHUB_OUTPUT
          elif [ "$CRON" = "30 9 * * 1-5" ]; then
            echo "mode=etfs" >> $GITHUB_OUTPUT
          else
            echo "mode=all" >> $GITHUB_OUTPUT
          fi

      - name: Run Bond & ETF collection
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY || vars.KRX_API_KEY }}
          KRX_OPENAPI_KEY: ${{ secrets.KRX_API_KEY || vars.KRX_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_TIER: ${{ vars.POLYGON_TIER || 'free' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOND_ETF_MODE: ${{ steps.detect_mode.outputs.mode }}
        run: python api/run_bond_etf.py

      - name: Commit & push results
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/
          MODE="${{ steps.detect_mode.outputs.mode }}"
          HOUR_KST=$(TZ=Asia/Seoul date +%H:%M)
          git diff --staged --quiet || git commit -m "📊 bond·etf ${MODE} $(TZ=Asia/Seoul date +%Y-%m-%d) ${HOUR_KST}"
          BRANCH="${{ github.ref_name }}"
          PUSHED=false
          # 재시도 8회 + 지터 (2026-08-06 실패 fix) — main 에 push 하는 워크플로가 56개,
          # 봇 커밋 하루 292개. 고정 간격 재시도는 여러 워크플로가 같은 리듬으로 재충돌한다.
          for i in 1 2 3 4 5 6 7 8; do
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin "$BRANCH" && git push origin "$BRANCH"; then
              PUSHED=true
              break
            fi
            WAIT=$(( i * 7 + RANDOM % 15 ))
            echo "Push attempt $i failed, retrying in ${WAIT}s (jittered)..."
            sleep "$WAIT"
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::All 8 push attempts failed (main 경합) — 다음 스케줄에서 재시도"
            exit 1
          fi

      - name: Publish hot data to VERITY-data
        if: always()
        uses: ./.github/actions/publish-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.VERITY_DATA_PAT }}
          blob_token: ${{ secrets.VERCEL_BLOB_TOKEN }}
