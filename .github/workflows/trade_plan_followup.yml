# trade_plan v0_log 사후 추적 — 진입 후보 row 의 5/14/30일 가격·verdict 채움
# daily_analysis_full (UTC 07:00 = KST 16:00) 이후 recommendations.json 기준으로 followup.
# h30 도달 시 케이스 자동 종료. A 단계 회귀 분석용 페어 데이터 누적.

name: Trade Plan v0 Followup

on:
  schedule:
    # 월~금 KST 17:30 (UTC 08:30) — daily_analysis_full 완료 후 1.5h 버퍼.
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

# Node.js 24 강제 — 2026-06-02 GitHub Node 20 deprecation 대비 (2026-05-07)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  # data/* 를 쓰는 모든 워크플로를 단일 그룹으로 직렬화 (export_trade_daily 와 동일 그룹).
# 🚨 2026-08-11 그룹 분리 — 기아 회피. 이 워크플로는 verity-data-write 의 다른 구성원과
#   **공유 산출물이 0** 이다(정적 감사: git add 경로 교집합 없음). 그런데 같은 그룹에 있어
#   daily_analysis_full(114분)이 락을 쥐고 daily_analysis(매시간)가 도착하는 동안
#   pending 슬롯 1칸에서 계속 축출됐다. 상세 = [[feedback_concurrency_starvation_pending_slot]].
#   경량군끼리는 직렬화를 유지한다(전부 ≤13분, 미발견 겹침 대비 안전 마진).
  group: verity-data-write-light
  cancel-in-progress: false

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run followup
        run: python scripts/trade_plan_followup.py

      - name: Commit log update
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          # 처리할 holding 0건이면 jsonl 미생성 — graceful 처리
          if [ ! -f data/metadata/trade_plan_v0_log.jsonl ]; then
            echo "no log file (no holdings to follow up)" && exit 0
          fi
          git add data/metadata/trade_plan_v0_log.jsonl
          DATE_KST=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "📈 trade_plan v0 followup ${DATE_KST}"
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash -X ours origin "$BRANCH" && git push origin "$BRANCH"; then
              exit 0
            fi
            echo "Push attempt $i failed, retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          echo "::warning::push 5회 실패 — 다음 cron 에서 재시도"
