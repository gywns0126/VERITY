name: AlphaConsole Public Observations

# 7-axis audit
# 1 env: existing SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY only.
# 2 push trigger: none. The job writes Supabase only and creates no git commit.
# 3 concurrency: dedicated group; duplicate scheduled/manual runs cannot overlap.
# 4 cron: once daily at 13:17 UTC (22:17 KST). Durable DB state chooses a 1-3 day interval.
# 5 KIS: not imported and no token path is used.
# 6 pip: none; stdlib publisher and unittest only.
# 7 N=2: after migration and merge, verify one manual live run and the next due scheduled run.

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only; do not write Supabase'
        required: true
        default: true
        type: boolean
      force:
        description: 'Ignore next_run_at (still keeps source dedupe)'
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: alphaconsole-public-observations
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'gywns0126/VERITY' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Contract tests
        run: python -m unittest tests.test_system_thesis_publisher

      - name: Publish due observations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then ARGS+=(--dry-run); fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then ARGS+=(--force); fi
          python scripts/publish_system_thesis.py "${ARGS[@]}"
