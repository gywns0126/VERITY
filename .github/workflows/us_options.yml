name: US Options Snapshot (IV / OI / P-C)

# 2026-08-09 신설 — 미장 가격 미시구조 축. 커버리지 점검에서 통째로 비어 있던 자리다.
# 🚨 정정 기록: 같은 날 나는 "옵션은 유료 벤더 계약 후에만" 이라고 보고했는데 그건 Polygon
#   무료 tier(스냅샷 403)만 보고 내린 결론이었다. yfinance 가 옵션 체인을 그대로 준다
#   (AAPL 만기 20 · IV·OI·volume 포함, 종목당 ~1.9초). 무료로 가능하다.
#
# 7축 audit (2026-08-09):
#   env    = 없음 (yfinance 무키)
#   push   = data/ 만 commit → RULE 2 무관 (vercel-api 외부)
#   concur = 전용 group
#   cron   = 매일 UTC 21:30 = KST 06:30. 미장 마감(20:00 UTC) 뒤 스냅샷.
#            us_insider(04:00) · us_form144(20:30 월수금) 과 시간대 분리
#   KIS    = 무관
#   pip    = requirements.txt (yfinance 기등록, 신규 의존 0)
#   RULE 8 = 수동 dispatch N=1 + 다음 정기 N=2. 산출 **건수** 확인 의무

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      max_seconds:
        description: 'wall-clock budget (기본 1800s = 30분)'
        required: false
        default: '1800'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: verity-us-options
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect US options snapshot
        # 전 유니버스 rotation + carry-forward(14일 초과분 폐기). 산출 0건이면 exit 1.
        env:
          US_OPTIONS_MAX_SECONDS: ${{ github.event.inputs.max_seconds || '1800' }}
        run: python -m api.collectors.us_options_snapshot

      - name: Commit data/us_options.json
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/us_options.json
          if git diff --staged --quiet; then
            echo "[us_options] no changes"
            exit 0
          fi
          TODAY_KST=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git commit -m "🧮 us_options ${TODAY_KST}"
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin "$BRANCH" --quiet
            if git rebase -X ours "origin/$BRANCH" --quiet && git push origin "HEAD:$BRANCH" --quiet; then
              echo "[us_options] push 완료 (시도 $i)"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::push 5회 실패"
          exit 1
