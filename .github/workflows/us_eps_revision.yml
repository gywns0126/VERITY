name: US EPS Revision (analyst estimate trend)

# 2026-08-09 신설 — 트랙 A2(시계 시작). docs/DATA_LAYER_RESEARCH_20260809.md §4-3.
# 애널리스트 추정치 리비전(상향/하향·변화폭). 소스 = yfinance eps_trend + eps_revisions.
#
# 🚨 이건 PIT 히스토리가 아니라 **당일 기준 90일 롤링 창** 스냅샷이다. 90일 초과 구간은
#   data/us_eps_revision_trail.jsonl 누적으로만 복원된다 → 지금 시작해야 시계가 돈다.
# 🚨 라이선스 — 애널리스트 집계 class. **공개 발행 금지**(us_analyst_consensus 와 동일 취급,
#   PM 2026-07-10 결정). publish-data allowlist 재추가 금지.
# 🚨 트랙 A 규율 — 수집만. 스코어 통합은 사전등록 게이트 통과 후.
#
# 7축 audit (2026-08-09):
#   env    = 없음 (yfinance 무키)
#   push   = data/ 만 commit → RULE 2 무관
#   concur = 전용 group
#   cron   = 주 3회 UTC 22:10 (= KST 07:10 화·목·토). us_options(21:30) 와 40분 간격
#   KIS    = 무관
#   pip    = requirements.txt (yfinance 기등록)
#   RULE 8 = 수동 dispatch N=1 + 다음 정기 N=2. 산출 **건수** 확인 의무

on:
  schedule:
    - cron: '10 22 * * 1,3,5'
  workflow_dispatch:
    inputs:
      max_seconds:
        description: 'wall-clock budget (기본 1800s = 30분)'
        required: false
        default: '1800'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: verity-us-eps-revision
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect US EPS revisions
        # 전 유니버스 rotation + carry-forward(21일 초과 폐기). 산출 0건이면 exit 1.
        env:
          US_EPS_REV_MAX_SECONDS: ${{ github.event.inputs.max_seconds || '1800' }}
        run: python -m api.collectors.us_eps_revision

      - name: Commit data/us_eps_revision.json + trail
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          # RULE 4 — L2 누적 trail 도 함께(미add 시 다음 run rebase 거부)
          git add data/us_eps_revision.json data/us_eps_revision_trail.jsonl
          if git diff --staged --quiet; then
            echo "[us_eps_rev] no changes"
            exit 0
          fi
          TODAY_KST=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git commit -m "📈 us_eps_revision ${TODAY_KST}"
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin "$BRANCH" --quiet
            if git rebase -X ours "origin/$BRANCH" --quiet && git push origin "HEAD:$BRANCH" --quiet; then
              echo "[us_eps_rev] push 완료 (시도 $i)"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::push 5회 실패"
          exit 1
