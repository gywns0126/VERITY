name: Price Pulse (1m KR/US 지수 + 보유 + 추천)

# 2026-05-11 사용자 결정: 핵심 가격만 1분 cron 으로 lite 갱신.
# 배경: daily_realtime 5분 cron + 9m45s run = drop 빈번 + 갱신 지연.
# 본 워크플로: main.py 우회 → ~30~60초 run.
# - import: 가벼움 (requests + yfinance lazy + KIS broker lazy)
# - fetch: yahoo batch (지수 7 + US 종목) + KIS get_current_price (KR 직렬)
# - output: data/price_pulse.json (portfolio.json 과 분리, race 없음)
# - Vercel API merge 는 후속

on:
  # 발화 = Vercel Cron 매분 → /api/cron/dispatch_pulse → repository_dispatch 단일 통로.
  # 2026-05-16 5분 KIS 폭주 사고 후 broker cache_only=True 모드 적용 → 신규 발급 절대 불가.
  # 새 토큰 발급 source = kis_token_refresh (KST 23:45) / daily_realtime backup.
  repository_dispatch:
    types: [price_pulse]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  # 별도 그룹 — verity-data-write (daily_analysis 군) / verity-realtime (daily_realtime) 와 격리.
  # cancel-in-progress: false 큐잉. data/price_pulse.json 단일 파일 race 없음.
  group: verity-pulse
  cancel-in-progress: false

jobs:
  pulse:
    # 🚨 2026-08-15 실측 — 취소 58%는 동시성 축출이 아니라 **타임아웃**이었다.
    #   표본 100건: cancelled 58 / success 41. 취소분의 job 시간이 309·319·320·322초로
    #   전부 5분 경계에 몰려 있고, 12개 step 을 실제로 실행하다 죽었다(큐 대기 아님).
    #   성공분 실측 289초 — 한도 300초 대비 여유가 11초뿐이라 조금만 느리면 잘린다.
    #   step 프로파일(GitHub jobs API, print 시각 아님):
    #     publish 126s · pip install 61s · checkout 41s · setup-python 24s
    #     · **실제 작업(Run price pulse) 19s** · commit 3s · warm 7s = 289s
    #   즉 19초 작업에 오버헤드가 93%다.
    #   조치 ① timeout 5→12분 (즉시 절단 중단) ② checkout fetch-depth 로 41s 축소.
    #   🚫 publish(126s) 축소는 하지 않는다 — publish-data 는 force_orphan: true 로
    #     VERITY-data main 을 통째 교체한다. 파일 목록을 줄이면 나머지 74개가 삭제된다.
    #     (전체 발행 자체는 cockpit_aggregate 5분 cron 과 중복이지만, 줄이려면 액션의
    #      배포 방식부터 바꿔야 하므로 별건이다.)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 전체 히스토리 clone 이 41초였다. price_pulse 커밋만 13,140건이라 누적이 크다.
          # commit + `git pull --rebase` 재시도가 있어 0(=전체) 대신 얕은 이력을 남긴다.
          # dart_catalyst_pulse 선례와 동일 값.
          fetch-depth: 10

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 현재 날짜 (KST)
        id: date
        run: echo "today=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: KIS 토큰 캐시 복원
        # daily_realtime / daily_analysis 가 발급한 token 재사용 (KIS 일 1회 발급 정책 정합)
        uses: actions/cache@v4
        with:
          path: ~/.cache/verity_kis_token.json
          key: kis-token-v2-${{ runner.os }}-${{ steps.date.outputs.today }}
          restore-keys: |
            kis-token-v2-${{ runner.os }}-

      - name: Run price pulse
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_OPENAPI_BASE_URL: ${{ secrets.KIS_OPENAPI_BASE_URL || vars.KIS_OPENAPI_BASE_URL }}
          # 2026-06-03: cache_only consumer 도 Supabase 공유 store read fallback (file cache 날짜-key
          # 버그 우회). read-only — 발급 X (RULE 1). daily_analysis/daily_realtime 와 동일 store.
          KIS_SHARED_TOKEN: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python api/cron/price_pulse.py

      - name: Commit data/price_pulse.json
        id: commit
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/price_pulse.json
          # 🚨 lock 파일도 함께 — broker 가 발급 1일 1회 ABSOLUTE 룰 위반 안 하도록 propagation 보장.
          # cache_only=True 라 신규 발급 안 하지만 defense in depth.
          git add data/.kis_issued_date.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "[pulse] no changes"
            echo "changed=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          TIME_KST=$(TZ=Asia/Seoul date +%H:%M)
          git commit -m "💓 price_pulse ${TIME_KST}"
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash -X ours origin "$BRANCH" && git push origin "$BRANCH"; then
              echo "changed=1" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "[pulse] push attempt $i failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done
          echo "changed=0" >> $GITHUB_OUTPUT
          echo "::warning::[pulse] push 5회 실패 — 다음 cron 에서 재시도"

      - name: Publish price_pulse.json to gh-pages
        if: steps.commit.outputs.changed == '1'
        # gh-pages 갱신 — 프론트가 raw.githubusercontent gh-pages 에서 fetch
        # force_orphan publish 라 다른 워크플로 산출물도 main HEAD 기준 함께 재발행됨 (race 안전)
        uses: ./.github/actions/publish-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.VERITY_DATA_PAT }}
          blob_token: ${{ secrets.VERCEL_BLOB_TOKEN }}

      - name: Warm stock_slice (콜드 스타트 제거)
        # 5분 주기 핑으로 슬라이스 함수 인스턴스+모듈캐시(30분 TTL) 상시 웜 유지 (2026-07-10).
        # 웜 인스턴스 = 임의 티커 조회도 메모리 슬라이스(~0.2s). 콜드(첫 요청 8소스 로드 ~2.8s) 사용자 노출 차단.
        if: always()
        continue-on-error: true
        run: |
          # 인기 상위 20 (KR 시총상위 10 + US 10) — CDN 캐시 매 5분 갱신 유지 → 상시 ~0.05s.
          # 미워밍 티커도 웜 인스턴스 도달 시 ~0.7s (모듈캐시). curl 병렬(-Z 미지원 환경 고려 백그라운드).
          for tk in 005930 000660 373220 207940 005380 000270 068270 005490 035420 051910 \
                    AAPL MSFT NVDA GOOGL AMZN TSLA META AVGO BRK-B WULF; do
            curl -s -o /dev/null -m 20 "https://project-yw131.vercel.app/api/stock_slice?ticker=$tk" &
          done
          wait || true
