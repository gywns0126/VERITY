name: KR Stock Flow (외국인·기관 5일 수급)

# 2026-07-30 분리 신설 — 원래 daily_analysis_full 의 한 스텝이었다.
#
# 🚨 분리 사유 (실측):
#   daily_analysis_full 은 verity-data-write 그룹을 **17개 워크플로와 공유**하면서 실행이
#   1h56m~2h30m 이다(2h30m21s = timeout-minutes 150 정확히 도달 사례 존재). 그 안에 수급 빌더가
#   들어 있어, 수집 캡을 올릴수록 락 점유가 길어져 형제 워크플로(reports_v2_cron·dart_meta_backfill
#   등)가 큐에서 취소됐다. 수급은 다른 스텝과 데이터 의존이 없으므로 떼어내는 게 맞다.
#
# 입력 의존 = data/stock_report_public.json(universe, 시총순 rotation 기준) + data/recommendations.json
#   (rec 우선풀). 둘 다 daily_analysis_full 이 커밋해 두는 산출물이라, 이 워크플로는 저장소에
#   커밋된 판을 읽는다. universe 는 일 단위로 거의 안 변해 하루 시차는 무해하다.
#   → 그래서 daily_analysis_full(07:07 UTC 시작, ~2h) 이 끝난 뒤인 10:00 UTC 에 돈다.
#
# 🚨 anti-bot = 네이버가 진짜 병목(DART 와 달리 IP 차단 위험). 요청 *간격* DELAY 0.4s 는 빌더
#   상수이고 여기서 바꾸지 않는다. 조절 대상은 일별 물량(FLOW_MAX_TICKERS)뿐.
#   관측 지표 = data/stock_flow_5d.json 의 _meta.ok / _meta.collected_today.
#   1.0 에서 유의하게 떨어지면 차단 신호 → FLOW_MAX_TICKERS 하향.
#
# RULE 7 = 외국인/기관 순매매량(외부 시장 사실)만. 자체 flow_score·점수 비노출.

on:
  schedule:
    # 평일 19:00 KST = 10:00 UTC. daily_analysis_full(16:07 KST 시작, ~2h) 종료 후.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      max_tickers:
        description: '일별 수집 캡 (기본 500). anti-bot 신호 시 하향'
        required: false
        default: '500'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  # 🚨 독립 그룹 — verity-data-write(17개 공유) 에서 의도적으로 분리. 이게 이 워크플로의 존재 이유다.
  #   커밋 경합은 아래 pull --rebase --autostash -X ours + 5회 재시도로 흡수(us_insider_trades 와 동일 패턴).
  group: verity-kr-flow
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 500종목 × DELAY 0.4s = 200s + fetch. 실측 여유 포함 45분. 캡 상향 시 재산정할 것.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build KR stock flow (외국인·기관 5일 순매매)
        # 시총순 rotation + 일별 캡 + carry-forward. 네이버 외부 fetch(KIS 0 = RULE 1 무관).
        continue-on-error: true
        env:
          FLOW_MAX_TICKERS: ${{ github.event.inputs.max_tickers || '500' }}
        run: python api/builders/stock_flow_public_builder.py

      - name: 수집 결과 실측 출력 (anti-bot 관측)
        # RULE 8 관측 지표를 로그에 남긴다 — ok/collected 가 1.0 에서 떨어지면 차단 신호.
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os
          p = "data/stock_flow_5d.json"
          if not os.path.exists(p):
              print("::warning::stock_flow_5d.json 부재 — 빌더 실패 의심")
              raise SystemExit(0)
          m = (json.load(open(p, encoding="utf-8")) or {}).get("_meta", {})
          ok, got = m.get("ok"), m.get("collected_today")
          ratio = (ok / got) if (isinstance(ok, (int, float)) and got) else None
          print(f"[flow] universe={m.get('universe')} collected_today={got} ok={ok} "
                f"ratio={ratio if ratio is None else round(ratio, 3)} count={m.get('count')}")
          if ratio is not None and ratio < 0.95:
              print(f"::warning::수집 성공률 {ratio:.1%} < 95% — 네이버 차단 의심. FLOW_MAX_TICKERS 하향 검토")
          PY

      - name: Commit data/stock_flow_5d.json
        # [[feedback_cron_commit_author_github_match]] gywns0126@gmail.com (GitHub 검증).
        # [[feedback_data_collection_verification_mandatory]] specific path commit.
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          if [ -f data/stock_flow_5d.json ]; then git add data/stock_flow_5d.json; fi
          if git diff --staged --quiet; then
            echo "[kr_flow] no changes"
            exit 0
          fi
          TODAY_KST=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git commit -m "📊 kr_stock_flow ${TODAY_KST}"
          BRANCH="${{ github.ref_name }}"
          PUSHED=false
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash -X ours origin "$BRANCH" && git push origin "$BRANCH"; then
              PUSHED=true
              break
            fi
            echo "push attempt $i failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::warning::push 5회 실패 — 다음 cron 재시도 (publish-data 는 main HEAD 기준 진행)"
          fi

      - name: Publish to VERITY-data + Vercel Blob
        if: always()
        uses: ./.github/actions/publish-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.VERITY_DATA_PAT }}
          blob_token: ${{ secrets.VERCEL_BLOB_TOKEN }}
