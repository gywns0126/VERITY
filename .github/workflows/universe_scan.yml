# Universe Scan — universe scan + stock_filter 별도 cron (2026-05-10).
# project_phase_2a_ramp_up_audit + macro_collect 패턴 확장:
#   - 5/10 5000 stage workflow_dispatch = 35분 universe + 75분 STEP 3+ = 110분 SIGTERM
#   - universe + filter 분리 → daily_analysis 는 candidate jsonl 만 읽음
#
# 결과: data/universe_candidates.json (collected_at + candidates + diagnostics)
# daily_analysis_full STEP 2 = snapshot 읽기 fast path (max_stale 2h) + inline fallback.

name: Universe Scan

on:
  schedule:
    # 평일 KST 15:30 (= UTC 06:30 월~금). KR 시장 마감 (15:30) 직후 = 당일 종가 반영.
    # daily_analysis_full (KST 16:07) 보다 37분 일찍 시작 → snapshot 1분 stale 로 fast path hit.
    - cron: '30 6 * * 1-5'
  # 2026-05-18 — Vercel Cron fallback (GitHub Actions silent miss 회피).
  # 5/16~5/18 정기 cron 3일 silent miss 학습. dispatch_pulse.py 시각 매핑 → repository_dispatch.
  repository_dispatch:
    types:
      - universe_scan
  workflow_dispatch:
    inputs:
      verity_mode:
        description: 'VERITY_MODE (LLM 호출 정책). manual default = staging.'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - prod
          - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write   # main 에 universe_candidates.json commit

# WARN-17: data/* 쓰기 워크플로 단일 그룹 직렬화 (verity-data-write).
#
# 🚨 2026-08-11 분리 — universe_scan 만 단독 그룹으로 뺀다. 공유 그룹에서 **기아**했다.
#
#   GitHub 은 `cancel-in-progress: false` 여도 **pending 슬롯이 1개**다. 같은 그룹에 새 run 이
#   도착하면 대기 중이던 run 을 취소한다(in-progress 는 무사). verity-data-write 는 19개
#   워크플로가 공유하고 그중 `daily_analysis` 가 **매시간** 도착한다.
#
#   2026-08-10 실측 — 취소 시각이 다음 run 생성 시각과 초 단위로 일치한다:
#     daily_analysis_full 07:50:43 →10:23:52  (실행 중, 그룹 2h33m 점유)
#     daily_analysis      08:07:43 →08:13:19  ← 08:13:18 universe_scan 도착
#     universe_scan       08:13:18 →09:01:53  ← 09:01:52 daily_analysis_full 도착
#     daily_analysis_full 09:01:52 →09:07:45  ← 09:07:44 daily_analysis 도착
#     trade_plan_followup 09:56:05 →10:07:10  ← 10:07:09 daily_analysis 도착
#   universe_scan 은 58분이 필요한데 85분짜리 holder 뒤에서 매시간 축출돼 **차례가 오지 않는다.**
#   결과 = universe_candidates.json 4일 정지 → daily_analysis 가 26h stale 가드로 10연속 중단.
#   (daily_analysis 는 피해자다. 설계대로 빠르게 멈춘 것이지 그 자체 결함이 아니다.)
#
#   universe_scan 은 **키스톤**이다 — funnel·추천·daily_analysis 전부 이 산출물에 의존한다.
#   굶으면 안 되는 축이라 직렬화 편의보다 완주 보장을 택한다.
#
#   푸시 경합 안전 근거: 아래 commit 스텝이 **5회 재시도 + `pull --rebase --autostash -X ours`**
#   를 갖고 있다. 또 `git add` 가 specific path 라 충돌 표면이 좁고, daily_analysis* 는
#   universe_candidates.json 을 쓰지 않는다(5000 inline scan 분리, 위 주석 정합).
#   🚨 N=2 관찰점 = 이 파일의 push 재시도 warning 이 뜨는지. 뜨면 직렬화 복귀 검토.
concurrency:
  group: verity-universe-scan
  cancel-in-progress: false

jobs:
  # ── 중복 트리거 가드 (2026-08-15, daily_analysis_full 와 동일 설계) ─────────
  # 🚨 트리거가 둘이다 — GH `schedule`(30 6 * * 1-5) + Vercel `repository_dispatch`
  #   (5/16~5/18 정기 cron 3일 silent miss 학습으로 추가한 fallback). GH 가 정상 발화하면
  #   **둘 다 돈다**. fallback 에 "본편이 이미 돌았나" 확인이 없었다.
  #
  #   실측 (2026-08-15, GitHub API 표본 50건 / 20일): 중복 쌍 4건.
  #     08-07 / 08-11 / 08-12 / 08-14 — **4건 모두 양쪽 성공 = 순수 낭비** (run 당 35~53분).
  #     간격 75.5~88.8분. 정규 슬롯은 24h 간격이라 120분 창은 넉넉히 안전하다.
  #
  #   🚨 이 워크플로는 universe_candidates.json 생산자다. 잘못 건너뛰면 daily_analysis 가
  #     26h stale 게이트로 중단(exit 1 + 텔레그램)된다. 그래서 가드는 **선행이 '성공' 했을
  #     때만** 생략한다 — 성공했다면 후보 스냅샷이 방금 갱신된 상태이므로 게이트가 만족된다.
  #     실패·취소·진행중·조회실패는 전부 실행(fail-open)이라 결손 방향으로는 기울지 않는다.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout (가드 스크립트)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 같은 슬롯 성공분 확인
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF: ${{ github.run_id }}
          WINDOW_MIN: '120'
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"; echo "수동 실행 — 가드 미적용"; exit 0
          fi
          JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/universe_scan.yml/runs?per_page=30" 2>/dev/null) || JSON=""
          if [ -z "$JSON" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"; echo "API 조회 실패 — fail-open 실행"; exit 0
          fi
          # 🚫 판정 로직 인라인 금지 — YAML 블록 스칼라가 깨져 워크플로가 무효가 된다(실측).
          OUT=$(printf '%s' "$JSON" | python3 scripts/ci/duplicate_run_guard.py)
          echo "$OUT"
          echo "run=$(printf '%s' "$OUT" | grep -oE '^run=[01]$' | tail -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"

  scan:
    needs: guard
    if: needs.guard.outputs.run == '1'
    runs-on: ubuntu-latest
    # 🚨 2026-08-19 — 60 → 90. 종전 주석("cooler 누적 35분 → 안전 마진 25분")은 **낡았다**.
    #   실측 scan job 소요: 8/13 57.9분 · 8/14 59.5분 · 8/18 59.75분(마진 15초) →
    #   **8/19 두 run 모두 정확히 60:00 에서 cancelled**(id 32223678918 / 32227395097).
    #   지배 구간은 단일 스텝 `Run universe scan + filter` 57분 17초 (나머지 전부 합쳐 2.7분).
    #   결과: multibagger_watch·universe_candidates 가 8/18 에서 갱신 정지.
    #   🚨 conclusion 이 failure 가 아니라 **cancelled** 라 실패 알림에 안 걸린다 — 조용한 정지였다.
    #   본 조치는 지혈이다. 근본은 스캔 작업량이고 [[project_cron_overload_2026_08_14]] 소관.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 현재 날짜 (KST)
        id: date
        run: echo "today=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: KIS 토큰 캐시 복원
        # 2026-05-16 추가 — universe_scan 도 KIS env 사용 → cache 없으면 신규 발급 source 됨.
        # 다른 KIS workflow 와 동일 v2 키 (2026-05-16 stale chain 깨려고 prefix bump).
        uses: actions/cache@v4
        with:
          path: ~/.cache/verity_kis_token.json
          key: kis-token-v2-${{ runner.os }}-${{ steps.date.outputs.today }}
          restore-keys: |
            kis-token-v2-${{ runner.os }}-

      - name: Run universe scan + filter
        env:
          # 2026-05-11: VERITY_MODE — schedule cron = prod, manual dispatch = input.
          VERITY_MODE: ${{ github.event.inputs.verity_mode || 'prod' }}
          # 2026-05-27 fix — ANALYSIS_MODE 설정 (mode=unknown 13 entry 발생 원인).
          # stock_filter._log_w1_runtime mode = ANALYSIS_MODE env. 미설정 시 default "unknown".
          # 5/10 universe_scan 분리 commit 후 누락 잔재. 설정 후 jsonl mode=universe_scan 정합.
          ANALYSIS_MODE: universe_scan
          # ramp-up stage 환경변수 (daily_analysis_full 와 동일 secret 재사용)
          UNIVERSE_RAMP_UP_STAGE: ${{ secrets.UNIVERSE_RAMP_UP_STAGE }}
          # 2026-05-18 PM 옵션 C 결정 — wide_scan SHADOW 진입 (5000→1000 coarse filter).
          # default DISABLED → SHADOW 명시. PRODUCTION 게이트 = 자기 산식 8/10 + 학술 N≥30.
          WIDE_SCAN_MODE: ${{ vars.WIDE_SCAN_MODE || 'SHADOW' }}
          # KIS / DART / KRX (stock_filter 가 사용)
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY || vars.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET || vars.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO || vars.KIS_ACCOUNT_NO }}
          KIS_OPENAPI_BASE_URL: ${{ secrets.KIS_OPENAPI_BASE_URL || vars.KIS_OPENAPI_BASE_URL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY || vars.DART_API_KEY }}
          # 2026-05-11 fix: KR universe build (KRX K1) 가 KRX_API_KEY env 사용. 둘 다 설정 (daily_analysis_full 정합).
          KRX_API_KEY: ${{ secrets.KRX_API_KEY || vars.KRX_API_KEY }}
          KRX_OPENAPI_KEY: ${{ secrets.KRX_API_KEY || vars.KRX_API_KEY }}
          # Telegram (FATAL 시 alert)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 🚨 소요를 스스로 신고한다 — 8/19 정지는 "느려지는 중" 이 어디에도 안 남아서
          #   한도에 닿는 순간까지 아무도 몰랐다(8/18 마진 15초). 다음 잠식은 넘기 전에 보인다.
          _t0=$SECONDS
          python -m api.builders.universe_scan_builder
          _el=$(( SECONDS - _t0 ))
          _budget=$(( 90 * 60 ))
          _pct=$(( _el * 100 / _budget ))
          echo "[universe_scan] scan 소요 ${_el}s (${_pct}% / 예산 ${_budget}s)"
          if [ "$_el" -gt $(( _budget * 75 / 100 )) ]; then
            echo "::warning title=universe_scan 예산 잠식::${_el}s = 예산의 ${_pct}%. 8/19 에 60분 한도 초과로 2회 cancelled 된 이력이 있다(cancelled 라 실패 알림에 안 걸린다). 작업량 축소 검토."
          fi

      - name: Build candidates diff (편입/이탈, LLM 0)
        if: always()
        run: python -m api.builders.candidates_diff_builder || echo "[cand_diff] skip"

      - name: Upload diff to private bucket (오퍼레이터 전용)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/upload_operator_data_to_supabase.py --only candidates_diff || echo "[cand_diff] upload skip"

      - name: Build + upload 멀티배거 발행물 (알파콘솔 전용)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # multibagger_watch.jsonl(누적) → data/multibagger_watch.json(최신 일자·상위 120).
          # 🚨 산식 변경 0 · 신호 재계산 0 — 잘라내기 + 자기신고(로깅 전용·커버리지)만 한다.
          # 🚨 --only 로 좁힌다 — 전체 업로드는 타 워크플로 산출물을 stale 로 덮는다(위 선례).
          # 실패해도 스캔 결과를 버리지 않는다 — 발행물은 부차 산출물이다.
          python3 api/builders/multibagger_operator_builder.py \
            && python scripts/upload_operator_data_to_supabase.py --only multibagger_watch \
            || echo "[multibagger] 발행물 생성/업로드 skip"
          # 선별 리스트 — 승격→채점 결과를 일반 후보와 분리(PM 지시 2026-08-22).
          # 🚨 이 시점의 portfolio.json 은 **직전 분석분**이라 오늘 승격분은 아직 미채점이다.
          #   그게 정상이며 리스트가 `waiting_n` 으로 그 상태를 구분해 신고한다.
          #   채점 반영본은 daily_analysis 뒤 스텝이 다시 만든다(아래 워크플로 참조).
          python3 api/builders/multibagger_picks_builder.py \
            && python scripts/upload_operator_data_to_supabase.py --only multibagger_picks \
            || echo "[multibagger] 선별 리스트 skip"

      - name: Commit data/universe_candidates.json
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/universe_candidates.json
          # diff 비교 기준 스냅샷 — 매 run 새 컨테이너라 커밋해야 다음 run 이 비교 가능
          # (universe_candidates.json 과 동일 노출 클래스 = 노출 증가 0). RULE 4 정합.
          git add data/.candidates_prev.json 2>/dev/null || true
          # 🚨 KIS lock 파일도 함께 — universe_scan 도 KIS env 사용 → 발급 가능 source.
          # 1일 1토큰 룰 propagation 위해 필수 (2026-05-16 폭주 사고 후 추가).
          git add data/.kis_issued_date.txt 2>/dev/null || true
          # P0-2b fix (2026-05-16): runtime_load_log.jsonl 누락 — 574538fd (5/12) commit 가
          # daily_analysis inline 5000 scan 제거 → universe_scan 이 유일한 logging caller.
          # universe_scan.yml 의 git add 가 specific file 만 추가돼서 jsonl 누락 → entry 0건/5일.
          # daily_analysis* 는 git add data/ 라 자동 포함. universe_scan 만 결함.
          git add data/metadata/runtime_load_log.jsonl 2>/dev/null || true
          # wide_scan_log.jsonl 도 함께 — SHADOW 누적 데이터 (5/11 1 entry / 6일 = propagation 결함).
          # 65 거래일 SHADOW 검증 게이트 (TG-1, 8월 말 PRODUCTION) 정합 위해 누적 필수.
          # 5번째 같은 패턴 (KIS lock / fred_health / runtime_load 후속).
          git add data/wide_scan_log.jsonl 2>/dev/null || true
          # 🚨 분석 로테이션 상태 — 8/12 도입 후 미영속 = 6번째 같은 패턴 (RULE 4).
          # 이 파일이 안 실리면 지명이 매 run cold start → 티커 asc 동결 (8/25 실측:
          # US 지명 A~AMG 고정 · KR 71% 저코드 · V 순번 1,387/1,505 영구 미도달).
          # "돌아가며 전부 본다"(PR #357) 설계의 전제라 제거 금지. 실패는 echo 로 가시화.
          git add data/metadata/analysis_rotation_state.json 2>/dev/null || echo "[rotation] state 파일 없음 — cold start run (지명 미실행이면 정상)"
          git add data/metadata/analysis_rotation_log.jsonl 2>/dev/null || echo "[rotation] log 파일 없음"
          # stock_history/YYYY-Qn.jsonl — 분기 시계열 5,000 raw 누적(append_universe_snapshot, wide_scan 옆 hook).
          # 🚨 7번째 RULE 4 violation (2026-07-01 audit): 05-11 inline scan 제거로 daily_full(broad git add data/)
          #   → universe_scan(specific add)로 이전될 때 stock_history 누락 → 50일 silent freeze(05-11~06-30).
          #   F-Score Δ/Magic Formula leading 데이터(8Q/13주 누적) 손실. CI mtime이 모니터 false-GREEN 으로 은폐.
          #   디렉토리 add = Q2/Q3/미래 분기 파일 자동 커버.
          git add data/stock_history/ 2>/dev/null || true
          # data_pipeline_health.json — write_data_pipeline_health() 편승 (universe_scan_builder.py).
          # 5/10 신설 후 7일 stale (commit 1건만, autostash 로 영영 stash 후 drop).
          # 6번째 RULE 4 violation 학습 (CLAUDE.md 5번째 명시 후 재발) — 2026-05-17 audit.
          # SystemHealthBar 의 DATA PIPELINE (Phase 2-B) 섹션 source 정합.
          git add data/metadata/data_pipeline_health.json 2>/dev/null || true
          # shadow_funnel_picks.json — wide_scan e_factor_rank 100-name (emission 입력).
          # RULE 4: specific git add 라 신규 파일 누락 시 silent 손실 (위 5~6차 사고 패턴).
          # generate_predictions(daily_analysis_full)가 다음 cron 에서 읽어 source=shadow_funnel.v0 예측 발생.
          git add data/metadata/shadow_funnel_picks.json 2>/dev/null || true
          # multibagger_watch.jsonl — wide_scan 가 KR 소형주 텐버거 후보 로깅 (2026-06-09 PM 결정 B).
          # 로깅 전용 trail (결정 0, active gate 2026-09). RULE 4: 신규 파일 git add 누락 방지.
          git add data/metadata/multibagger_watch.jsonl 2>/dev/null || true
          # multibagger_holdings.jsonl — 보유 종목 hold_pnl 축 (2026-08-06 PM 승인, 소비자 이전).
          # 🚨 RULE 4: 위 specific git add 패턴이라 이 줄이 없으면 신 trail 이 silent 손실된다.
          # 유니버스 행과 스키마가 달라 별 파일 (섞으면 소비자가 동질 population 가정하다 깨짐).
          git add data/metadata/multibagger_holdings.jsonl 2>/dev/null || true
          # multibagger_watch.json — 알파콘솔 발행물(위 빌드 스텝 산출). 업로드는 Supabase 로
          # 이미 갔으나 커밋해 두어야 다음 run·감사에서 무엇을 발행했는지 재현된다.
          # 🚨 RULE 4: specific add 패턴이라 이 줄이 없으면 신 파일이 silent 손실된다.
          git add data/multibagger_watch.json 2>/dev/null || true
          # 🚨 2026-08-22 전수 감사에서 발견한 누락 2건 — RULE 4.
          # multibagger_promote.json: 이 run 에서 만들고 같은 run 이 병합하므로 스캔은
          #   되지만, **daily_analysis 는 다른 run** 이라 커밋 안 되면 파일이 없다.
          #   그러면 picks_builder 가 승격분을 전부 'capped_out' 으로 오분류한다.
          git add data/metadata/multibagger_promote.json 2>/dev/null || true
          # multibagger_picks.json: daily_analysis 는 broad `git add data/` 라 자동이지만
          #   universe_scan 은 specific add 라 여기서 명시해야 한다.
          git add data/multibagger_picks.json 2>/dev/null || true
          git diff --staged --quiet && echo "no changes" && exit 0
          TIME_KST=$(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M)
          git commit -m "🔍 universe_candidates ${TIME_KST}"
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            # 2026-05-11 fix: --autostash 추가 — universe_scan 동안 builder 가 data_pipeline_health.json
            # 같은 파일 부수적 update 시 unstaged changes 발생. rebase 가 fail 함.
            if git pull --rebase --autostash -X ours origin "$BRANCH" && git push origin "$BRANCH"; then
              exit 0
            fi
            echo "Push attempt $i failed, retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          echo "::warning::push 5회 실패 — 다음 cron 에서 재시도"
