# 미장 전체 유니버스 일봉 이력 (yfinance) — KR `kr_chart_history` 대응.
# 2026-08-08 신설. 로컬 실측: 유니버스 5,324 → 수집 5,188 (97.4%) · 1.9GB · 17분(8병렬).
#
# 왜 필요한가: 2026-08-08 백테스트로 최종 점수의 39%(technical 17 · momentum 10 ·
#   volatility 6 · mean_reversion 6)가 전부 가격 파생임을 KR 에서 확인했다. 미장에서는
#   같은 검정을 못 했다 — 일봉 이력이 없었기 때문이다. 그 재료를 만든다.
#
# 🚨 git 비커밋 (1.9GB) — Blob 직행. kr_chart_history 와 동일 정책.
# 🚨 소스 = yfinance. 2026-08-08 실호출 검증에서 무료로 이력을 주는 곳이 여기뿐이었다
#   (Polygon 무료 과거 403·분당2콜 429 / FMP 403 / Alpha Vantage 프리미엄 / Finnhub 403 /
#    Stooq HTML 차단). 운영 `analyze_technical` 이 이미 쓰는 경로다.
# 🚨 KIS 무관 — RULE 1(1일 1토큰) 자원을 대량 US 일봉에 붙이지 않는다.
#
# 7축 audit (2026-08-08): env=VERCEL_BLOB_TOKEN 기존 등록(키 불요 소스) / push=0 (커밋 없음,
#   RULE 2 무관) / concurrency=전용 group / cron=월1회 / KIS 무관 /
#   pip=requirements(yfinance·curl_cffi 기등록) + npm @vercel/blob / RULE 8 N=2 큐(월간).
name: US Chart History (monthly)

on:
  schedule:
    # 매월 2일 07:11 UTC (= KST 16:11). kr_chart_history(1일 06:37 UTC)와 하루 띄워
    # 러너·Blob 동시 부하를 피한다.
    - cron: '11 7 2 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '이번 run 최대 종목 (0=전체). 부분 적재 시 다음 run 이 이어받음'
        required: false
        default: '0'
      resume:
        description: >-
          true = Blob 기보유 티커를 건너뛰고 잔여만 수집(차단으로 끊긴 run 이어받기).
          기본 false = 전량 재수집(월간 갱신 본래 목적).
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: verity-us-chart-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 로컬 17분 + Blob PUT 5,188건. GH 러너·Blob 지연 여유 포함

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Node (Blob 목록·업로드용)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Blob 기보유 목록 (resume 모드 전용 skip-list)
        # 🚨 2026-08-08 첫 CI 실행 학습 — 이 레이크는 레포에 커밋하지 않아서 러너가 매번 빈
        #   디스크로 시작한다. 수집기의 "파일 존재 = 체크포인트" 재개가 CI 에서는 무력했다.
        #   차단으로 끊긴 run 을 이어받으려면 Blob 기보유 목록이 필요하다.
        # 🚨 **기본값이 아니다.** skip-list 를 상시 켜면 "이미 있는 티커는 영영 다시 안 받는" 게
        #   되어 월간 갱신이 사실상 없어진다 — 오늘 us_prices.duckdb 에서 고친 바로 그 결함
        #   ("이미 있는 ticker = skip" → 날짜가 늘지 않음)과 같은 구조다. resume=true 일 때만 켠다.
        if: ${{ github.event.inputs.resume == 'true' }}
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.VERCEL_BLOB_TOKEN }}
        run: |
          cd .github/actions/publish-data
          npm install --no-save --silent --no-audit --no-fund @vercel/blob@^0.27
          node blob_list_prefix.js us_chart_history/ \
            "${{ github.workspace }}/data/us_chart_history_remote.txt"

      - name: Collect US daily history (yfinance · auto_adjust)
        # 기본 = 전량 재수집(월간 갱신). resume=true 일 때만 Blob 기보유분을 건너뛴다.
        # 🚨 2026-08-08 첫 실행: 2,418종(408초) 지점부터 야후가 러너 IP 를 차단해 남은 2,900종이
        #   20초 만에 실패 소모되고 45.4% 로 끝났다(로컬 맥 97.4%). 수집기에 청크 성공률 감시 +
        #   쿨다운 재시도를 넣었다. 그래도 끊기면 부분 산출을 올리고 resume=true 로 이어받는다.
        run: |
          ARGS=""
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          [ "$LIMIT" != "0" ] && ARGS="--limit $LIMIT"
          if [ "${{ github.event.inputs.resume }}" = "true" ] && \
             [ -f data/us_chart_history_remote.txt ]; then
            ARGS="$ARGS --skip-list data/us_chart_history_remote.txt"
            echo "[resume] Blob 기보유 skip-list 적용"
          fi
          python -m api.collectors.us_chart_history $ARGS

      - name: 미장 이벤트스터디 반쪽 빌드 (레이크가 러너에 있는 지금)
        # 🚨 2026-08-09 — US 이벤트스터디는 로컬 `us_prices.duckdb` 에서 만들고 있었는데
        #   그 레이크는 갱신 스케줄이 없어 2026-06-26 에 43일 멈춘 채였다(측정이 과거에 고정).
        #   여기서 만들면 방금 받은 5,188종 전 기간 일봉을 그대로 쓰므로 추가 수집 비용이 0이고,
        #   이 워크플로가 신선도 감시 대상이라 조용히 얼지 않는다.
        # 실패해도 계속 — 일봉 레이크 업로드(다음 스텝)가 이 run 의 본체다.
        continue-on-error: true
        run: python -m api.builders.us_event_study_builder

      - name: Blob 업로드 (us_chart_history/{ticker}.json)
        # publish-data 의 blob_upload.js 재사용 — kr_chart_history 와 동일 패턴.
        # 🚨 커버리지 게이트보다 **앞**에 둔다. 게이트가 먼저 exit 1 하면 그 run 이 모은
        #   수천 종이 통째로 버려진다(2026-08-08 실제로 2,418종을 그렇게 잃었다).
        #   부분이라도 올려야 다음 run 이 이어받는다 — 게이트는 그 뒤에서 판정만 한다.
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.VERCEL_BLOB_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::VERCEL_BLOB_TOKEN 없음"
            exit 1
          fi
          mkdir -p "${{ github.workspace }}/_us_history_dist/us_chart_history"
          cp data/us_chart_history/*.json \
             "${{ github.workspace }}/_us_history_dist/us_chart_history/" 2>/dev/null || true
          cp data/us_chart_history_meta.json \
             "${{ github.workspace }}/_us_history_dist/us_chart_history/_meta.json" 2>/dev/null || true
          # 이벤트스터디 US 반쪽 — 로컬 event_study_builder 가 조건부 GET 으로 받아 KR 과 합친다.
          cp data/us_event_study.json \
             "${{ github.workspace }}/_us_history_dist/us_chart_history/_event_study.json" 2>/dev/null || true
          cd .github/actions/publish-data
          npm install --no-save --silent --no-audit --no-fund @vercel/blob@^0.27
          node blob_upload.js "${{ github.workspace }}/_us_history_dist"

      - name: 커버리지 확인 (조용한 전량 실패 차단)
        # 🚨 2026-08-08 학습 — us_chart_daily 가 count 0 인 채 성공으로 끝나고 있었다.
        #   파일 mtime 만 보면 신선도 보드에 "0일 경과" 로 잡힌다. 없는 것보다 나쁘다.
        # have = 로컬 신규 + Blob 기보유 누적치. 업로드 뒤에 판정하므로 데이터 손실이 없다.
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("data/us_chart_history_meta.json", encoding="utf-8"))
          have, uni = m["have"], m["universe"]
          print(f"[us_chart_history] 보유 {have:,}/{uni:,} ({have/uni*100:.1f}%) "
                f"· 로컬 신규 {m.get('have_local', 0):,} · 원격 기보유 {m.get('have_remote', 0):,} "
                f"· 쿨다운 {m.get('cooldowns', 0)} · 조기중단 {m.get('stopped_early', False)}")
          if have < uni * 0.5:
              print("::error::커버리지 50% 미만 — 다음 run 이 이어받는다(부분 산출은 Blob 에 보존)",
                    file=sys.stderr)
              sys.exit(1)
          PY
