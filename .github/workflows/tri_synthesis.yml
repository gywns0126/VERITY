name: Tri-LLM Synthesis (weekly, operator-only)

# 3종 LLM 종합 사전계산 (2026-08-01, PM 결정). 추천 상위 brain_score N종목 × 주 1회.
# 🚨 비용 한정: LLM 호출은 이 워크플로 한 곳에서만 (온디맨드 없음, v2 하드캡 이연).
#   종목당 ~$0.05 (Perplexity+Gemini flash-lite+Claude opus-5 effort-low) × 25 × 주1 ≈ $5/월 예측가능.
# 🚨 오퍼레이터 전용: tri_synthesis.json 은 Brain grounding → 공개 발행 절대 금지(raw git/blob 노출 클래스).
#   private Supabase bucket 업로드만. gitignore 로 공개 repo 커밋 차단. authed /api/admin?type=tri_synthesis 서빙.
#
# 7축 audit: env=3 LLM 키+SUPABASE(서빙용) · push trigger 없음(공개 커밋 0) · concurrency 전용 group ·
#   cron 주1(silent skip 안전) · KIS 무관(RULE 1) · pip requirements · N=2=manual+다음 scheduled.

on:
  schedule:
    - cron: '0 21 * * 0'   # 일 UTC 21:00 = 월 KST 06:00 (US 종가 반영·KR 개장 전)
  workflow_dispatch:
    inputs:
      limit:
        description: '최대 종목 수 (비용 상한)'
        required: false
        default: '25'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write   # 장부 커밋용(산출물은 gitignore 봉인)   # 🚨 공개 커밋 안 함 (오퍼레이터 전용) — write 불요

concurrency:
  group: verity-tri-synthesis
  cancel-in-progress: false

jobs:
  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # 25종목 × 3-LLM ~1분 = 25분 + 마진
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build tri-LLM synthesis
        env:
          # 🚨 VERITY_MODE=prod 명시 — default 'dev' 면 mock 반환(실호출 0).
          VERITY_MODE: prod
          TRI_MAX_TICKERS: ${{ github.event.inputs.limit || '25' }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          PERPLEXITY_MODEL: ${{ vars.PERPLEXITY_MODEL || 'sonar-pro' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m api.builders.tri_synthesis_builder

      - name: Upload to private bucket (operator-only, tri_synthesis 만)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/upload_operator_data_to_supabase.py --only tri_synthesis

      - name: Commit LLM cost ledger (RULE 4 — 산출물은 gitignore 로 봉인 유지)
        if: always()
        run: |
          # 🚨 이 워크플로의 산출물(크라운주얼)은 .gitignore 로 커밋이 원천 차단되어 있다.
          #   여기서 커밋하는 것은 **비용 장부뿐** — 가장 비싼 LLM 호출이 관측에서 빠지던
          #   사각지대 해소(2026-08-06). 장부 미add 시 rebase 거부 사고도 함께 예방(RULE 4).
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/metadata/llm_cost.jsonl 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "💰 llm_cost 장부 — 3종 LLM 종합"
          for i in 1 2 3 4 5 6; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin main && git push origin main; then exit 0; fi
            sleep $(( i * 7 + RANDOM % 15 ))
          done
          echo "::warning::장부 push 실패 — 다음 run 에서 누적 재시도"
