name: US Analyst Consensus (yfinance)

# 2026-06-22 신설 — US 후속 (b) us_flow 컨센서스 1500 확대.
# 美 애널리스트 컨센서스(등급·목표가·업사이드) = 터미널 기본 메뉴. yfinance 무료(Finnhub rate 회피).
# 전 종목(sp1500 1505) rotation + carry-forward + budget. RULE 7 = 외부 사실(우리 점수 아님).

# 🚨 2026-07-01 권리감사 — US 애널리스트 컨센서스(yfinance)는 실권리자 Benzinga/S&P IP,
#   **공개 발행 영구 금지축**. 그때 schedule 까지 같이 껐다.
#
# 🚨 2026-08-09 schedule 만 복원 (PM 승인 — "중요도 순" 1순위). 발행 금지는 그대로다.
#   7/1 에 껐던 이유는 "공개 배포" 였는데, 8/2 봉인으로 이 자산은 이미 오퍼레이터 전용 경로만
#   남았다: public 커밋 스텝 제거 + git rm + .gitignore + blob allowlist 제외.
#   실제 전달 경로 = private_data.py → VERITY-private/data/ → 오퍼레이터 챗이 PAT 로 직독.
#   그 경로는 살아 있는데(파일 1.5MB 존재) 스케줄이 없어 **2026-08-02 이후 7일 정지**였다.
#   즉 지금 상태는 "공개를 막은 것" 이 아니라 "오퍼레이터 재료를 굶긴 것" 이었다.
#
#   🚫 **여기서 발행 allowlist 를 다시 건드리지 말 것.** `.github/actions/publish-data/action.yml`
#      의 파일 목록에 us_analyst_consensus.json 재추가 = PM 7/10 결정 위반. 세션 간 재추가
#      핑퐁이 이미 2회(9c8397eea·414ff9431) 있었다. 숫자 부활 = 유료 라이선스 계약 후에만.
#      상세 = 메모리 project_kr_index_public_data_2026_07_08.
on:
  schedule:
    # KST 07:00 월·수·금 (UTC 22:00 일·화·목). 컨센서스는 저빈도 변동이라 주 3회로 충분하고,
    # 1회 run 이 전량을 채운다(2026-08-02 실측: collected_today 5,269 · rate_limited 30).
    - cron: '0 22 * * 0,2,4'
  workflow_dispatch:
    inputs:
      max_seconds:
        description: 'wall-clock budget (기본 2400s)'
        required: false
        default: '2400'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: verity-us-consensus
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build US analyst consensus (yfinance)
        env:
          US_CONSENSUS_MAX_SECONDS: ${{ github.event.inputs.max_seconds || '2400' }}
        run: python -m api.builders.us_analyst_consensus_public_builder

      - name: private repo 동기화 (민감 데이터)
        # 🚨 2026-07-30 — 이 파일은 발행 영구 금지 자산(PM 7/10)인데 public repo 에 그대로 있어
        #   raw.githubusercontent 로 200 이 떴다. blob allowlist 에서만 빼고 repo 는 열려 있었다.
        #   이제 VERITY-private 로 올린다. PAT 없으면 조용히 skip(파이프라인 보호).
        #   ✅ 2026-08-02 봉인: public 커밋 스텝 제거 + git rm + .gitignore (schedule 은 이미 7/1 비활성,
        #   마지막 public 커밋 7/8 = "갱신 끊김" 우려는 이미 moot). 이후 보존 경로 = private_data.py 만.
        # 🚨 2026-08-09 continue-on-error 제거 + --strict. 이제 이 스텝이 **유일한 보존 경로**다
        #   (public 커밋은 8/2 에 닫혔다). 여기서 조용히 skip 되면 수집한 5,269종이 러너와 함께
        #   사라지는데 워크플로는 초록으로 끝난다 — 오퍼레이터는 재료가 없는 줄도 모른다.
        env:
          PRIVATE_DATA_PAT: ${{ secrets.PRIVATE_DATA_PAT }}
        run: python scripts/private_data.py push data/us_analyst_consensus.json --strict

      # (제거됨 2026-08-02) Commit data/us_analyst_consensus.json — 발행 금지 자산의 public 커밋 경로 폐쇄.
      #   파일은 git rm + .gitignore 로 트리에서 제거. 재추가 = PM 재승인 + 유료 라이선스만.

      - name: Publish to VERITY-data + Vercel Blob
        if: always()
        uses: ./.github/actions/publish-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.VERITY_DATA_PAT }}
          blob_token: ${{ secrets.VERCEL_BLOB_TOKEN }}
