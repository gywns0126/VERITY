name: US Chart Daily (covariance source)

# 중용 포트폴리오 공분산 전제조건(#8) — 미국 정렬 일봉(수정주가) 수집.
# 소스 = yfinance (2026-08-08 전환, 이전 KIS 해외 dailyprice).
# 산출 = data/us_chart_daily.json (kr_chart_daily 동일 shape).
# 🚨 전환 사유 = KIS 경로가 조용히 전량 실패(count 0 / missing 47종목 전부)하면서도
#    워크플로는 성공으로 끝나 신선도 보드에 "0일 경과" 로 잡혔다. 없는 것보다 나쁜 실패다.
# 🚨 부가 이득 = KIS 의존 제거. RULE 1(1일 1토큰)에서 대량 US 일봉에 가장 제약 큰 자원을
#    붙일 이유가 없다. 이 워크플로는 이제 KIS 시크릿·토큰 캐시를 쓰지 않는다.

on:
  schedule:
    # 주1 — KST 일 06:00 (미장 금 마감 후). 250일 공분산 창이라 주간 갱신으로 충분.
    - cron: '0 21 * * 6'
  workflow_dispatch:

# Node.js 24 강제 (2026-06-02 GitHub Node 20 deprecation 대비)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  # data/* 쓰기 워크플로 단일 그룹 직렬화 (JSON 손상·lost-update 방지). cancel 대신 큐잉.
# 🚨 2026-08-11 그룹 분리 — 기아 회피. 이 워크플로는 verity-data-write 의 다른 구성원과
#   **공유 산출물이 0** 이다(정적 감사: git add 경로 교집합 없음). 그런데 같은 그룹에 있어
#   daily_analysis_full(114분)이 락을 쥐고 daily_analysis(매시간)가 도착하는 동안
#   pending 슬롯 1칸에서 계속 축출됐다. 상세 = [[feedback_concurrency_starvation_pending_slot]].
#   경량군끼리는 직렬화를 유지한다(전부 ≤13분, 미발견 겹침 대비 안전 마진).
  group: verity-data-write-light
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect US daily (yfinance · 수정주가)
        # 🚨 skip 가드를 두지 않는다. 이전 결함이 "조건 미충족 → 조용히 exit 0" 형태였다.
        #    수집기 자체가 전량 실패 시 exit 1 을 낸다(us_chart_daily.collect).
        run: python -m api.collectors.us_chart_daily

      - name: Commit us_chart_daily.json
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/us_chart_daily.json
          if git diff --staged --quiet; then
            echo "[us_chart_daily] 변화 없음 — 종료"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git commit -m "US 정렬 일봉 갱신 ${TODAY} (공분산 소스, yfinance 수정주가)"
          for i in 1 2 3; do
            if git pull --rebase --autostash -X ours origin main && git push origin main; then
              echo "[us_chart_daily] push 성공 (시도 $i)"
              exit 0
            fi
            echo "[us_chart_daily] push 시도 $i 실패 — 재시도"
            sleep $((i * 5))
          done
          echo "::warning::[us_chart_daily] push 3회 실패"
