name: Macro Synthesis (daily pre-market, operator-only)

# 거시(숲) 3종 LLM 시나리오 (PM 2026-08-03 "거시 경제 분석기"). 평일 장전 1회.
# 🚨 비용 한정: LLM 호출은 이 워크플로 한 곳만. 1세트/일 ≈ $0.08 → ~$2/월.
# 🚨 오퍼레이터 전용: macro_synthesis.json = 공개 발행 절대 금지. private bucket 업로드만,
#   gitignore 로 공개 repo 커밋 차단. authed /api/admin?type=macro_synthesis 서빙.
#
# 7축 audit: env=3 LLM 키+SUPABASE(업로드) · push trigger 없음(공개 커밋 0) · concurrency 전용 group ·
#   cron 일1(silent skip 저위험, tri 정합) · KIS 무관(RULE 1) · pip requirements · N=2=manual+다음 scheduled.

on:
  schedule:
    - cron: '50 22 * * 0-4'   # UTC 22:50 = KST 07:50 평일(월~금) 장전, 전일 US 종가·오버나이트 반영
  workflow_dispatch:
    inputs:
      force:
        description: '캐시 무시 강제 재생성'
        required: false
        default: 'false'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write   # 장부 커밋용(산출물은 gitignore 봉인)   # 공개 커밋 없음

concurrency:
  group: verity-macro-synthesis
  cancel-in-progress: false

jobs:
  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build macro synthesis
        env:
          VERITY_MODE: prod   # 🚨 default dev = mock — 실호출 위해 명시
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          PERPLEXITY_MODEL: ${{ vars.PERPLEXITY_MODEL || 'sonar-pro' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python -m api.builders.macro_synthesis_builder --force
          else
            python -m api.builders.macro_synthesis_builder
          fi

      - name: Upload to private bucket (macro_synthesis 만)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/upload_operator_data_to_supabase.py --only macro_synthesis

      - name: Commit LLM cost ledger (RULE 4 — 산출물은 gitignore 로 봉인 유지)
        if: always()
        run: |
          # 🚨 이 워크플로의 산출물(크라운주얼)은 .gitignore 로 커밋이 원천 차단되어 있다.
          #   여기서 커밋하는 것은 **비용 장부뿐** — 가장 비싼 LLM 호출이 관측에서 빠지던
          #   사각지대 해소(2026-08-06). 장부 미add 시 rebase 거부 사고도 함께 예방(RULE 4).
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/metadata/llm_cost.jsonl 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "💰 llm_cost 장부 — 거시 분석기"
          for i in 1 2 3 4 5 6; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin main && git push origin main; then exit 0; fi
            sleep $(( i * 7 + RANDOM % 15 ))
          done
          echo "::warning::장부 push 실패 — 다음 run 에서 누적 재시도"
