name: Macro Facts + US Demand Chain (daily pre-market)

# Public-source macro facts are read on Mac mini; Google/Perplexity generation is retired here.
# Only public facts, source URLs, quotes, dates, and producer receipts may enter mini_macro_facts.
# Never send private context, account data, credentials, or document bodies in the event payload.
# GitHub validates that public-source bundle and uses its existing Supabase secrets for private delivery.
# The existing weekday 07:50 KST job retains non-LLM US demand-chain observation only.
# A demand-chain success is not a macro-generation or private-delivery receipt.

on:
  schedule:
    - cron: '50 22 * * 0-4'   # UTC 22:50 = KST 07:50 평일(월~금) 장전, 전일 US 종가·오버나이트 반영
  repository_dispatch:
    types: [mini_macro_facts]
  workflow_dispatch:
    inputs:
      force:
        description: 'Compatibility input only; macro fact collection runs on Mac mini'
        required: false
        default: 'false'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write   # 장부 커밋용(산출물은 gitignore 봉인)   # 공개 커밋 없음

concurrency:
  group: verity-macro-synthesis
  cancel-in-progress: false

jobs:
  synth:
    if: github.event_name != 'repository_dispatch' || github.event.action != 'mini_macro_facts'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Observe US demand chain (관측-only, LLM 무관)
        # 국장 개장 전, 전일 미국 종가로 수요 체인(AI 반도체/소프트웨어/데이터센터/
        # 2차전지/바이오) 을 관측한다. PM 사고 2026-08-05 — 코스피를 끌어올린 팔란티어·
        # 캐터필러 실적과 앤트로픽-브로드컴 계약을 우리 시스템은 몰랐다. 유니버스 밖
        # 미국 대형주가 관측 대상이 아니었기 때문. 소급 검증(8/4 미국 종가)에서
        # AI 반도체 +6.19%(6/6) · AI 소프트웨어 +6.24% · PLTR z=8.46 포착 확인.
        # 이 워크플로에 얹은 이유 = 이미 KST 07:50(미장 마감 후·국장 개장 전)에 도는
        # 유일한 슬롯. 신규 cron 신설 회피 = RULE 8 부담 + GH 분 절약.
        # LLM 호출 0. Mac mini 거시 사실 생성·전달과 별개 관측이며 기존 오류 처리를 유지한다.
        continue-on-error: true
        env:
          VERITY_MODE: prod
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}   # EPS 서프라이즈 보강용, 없으면 가격 관측만
        run: python -m api.collectors.us_demand_chain

      - name: Commit US demand-chain observations (RULE 4)
        if: always()
        run: |
          # Only existing non-LLM observation outputs are staged.
          # The private macro fact bundle is received and uploaded by the separate delivery job.
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/observations/us_demand_chain.jsonl 2>/dev/null || true
          git add data/us_demand_chain.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "data: observe US demand chain"
          for i in 1 2 3 4 5 6; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash -X theirs origin main && git push origin main; then exit 0; fi
            sleep $(( i * 7 + RANDOM % 15 ))
          done
          echo "::warning::장부 push 실패 — 다음 run 에서 누적 재시도"

  deliver_mini_macro:
    # The owner-authenticated Mini sends public source facts only; no raw event body is logged.
    # This job never invokes a model or exports Supabase credentials to the Mini.
    if: github.event_name == 'repository_dispatch' && github.event.action == 'mini_macro_facts' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install existing dependencies
        run: pip install -r requirements.txt

      - name: Validate public-source Mini facts and preserve source timestamps
        run: python -m scripts.mini_document_readers --receive-dispatch "$GITHUB_EVENT_PATH"

      - name: Upload validated macro facts to private Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/upload_operator_data_to_supabase.py --only macro_synthesis
