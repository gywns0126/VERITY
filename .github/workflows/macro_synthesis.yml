name: Macro Synthesis (daily pre-market, operator-only)

# 거시(숲) 3종 LLM 시나리오 (PM 2026-08-03 "거시 경제 분석기"). 평일 장전 1회.
# 🚨 비용 한정: LLM 호출은 이 워크플로 한 곳만. 1세트/일 ≈ $0.08 → ~$2/월.
# 🚨 오퍼레이터 전용: macro_synthesis.json = 공개 발행 절대 금지. private bucket 업로드만,
#   gitignore 로 공개 repo 커밋 차단. authed /api/admin?type=macro_synthesis 서빙.
#
# 2026-08-07 추가: 미국 수요 체인 관측(LLM 0, 가격·Finnhub only). 국장 개장 전 슬롯을 공유한다.
#
# 7축 audit: env=3 LLM 키+SUPABASE(업로드)+FINNHUB(수요체인 EPS 보강, 없으면 가격만) ·
#   push trigger 없음(커밋 대상 = data/ 장부뿐 → vercel-api·operator-web 밖 = RULE 2 가드가 자동 skip) ·
#   concurrency 전용 group · cron 일1(silent skip 저위험, tri 정합) · KIS 무관(RULE 1) ·
#   pip requirements(yfinance 기존 등재) · N=2=manual+다음 scheduled.

on:
  schedule:
    - cron: '50 22 * * 0-4'   # UTC 22:50 = KST 07:50 평일(월~금) 장전, 전일 US 종가·오버나이트 반영
  workflow_dispatch:
    inputs:
      force:
        description: '캐시 무시 강제 재생성'
        required: false
        default: 'false'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write   # 장부 커밋용(산출물은 gitignore 봉인)   # 공개 커밋 없음

concurrency:
  group: verity-macro-synthesis
  cancel-in-progress: false

jobs:
  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build macro synthesis
        env:
          VERITY_MODE: prod   # 🚨 default dev = mock — 실호출 위해 명시
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          PERPLEXITY_MODEL: ${{ vars.PERPLEXITY_MODEL || 'sonar-pro' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python -m api.builders.macro_synthesis_builder --force
          else
            python -m api.builders.macro_synthesis_builder
          fi

      - name: Observe US demand chain (관측-only, LLM 무관)
        # 국장 개장 전, 전일 미국 종가로 수요 체인(AI 반도체/소프트웨어/데이터센터/
        # 2차전지/바이오) 을 관측한다. PM 사고 2026-08-05 — 코스피를 끌어올린 팔란티어·
        # 캐터필러 실적과 앤트로픽-브로드컴 계약을 우리 시스템은 몰랐다. 유니버스 밖
        # 미국 대형주가 관측 대상이 아니었기 때문. 소급 검증(8/4 미국 종가)에서
        # AI 반도체 +6.19%(6/6) · AI 소프트웨어 +6.24% · PLTR z=8.46 포착 확인.
        # 이 워크플로에 얹은 이유 = 이미 KST 07:50(미장 마감 후·국장 개장 전)에 도는
        # 유일한 슬롯. 신규 cron 신설 회피 = RULE 8 부담 + GH 분 절약.
        # LLM 호출 0 — 실패해도 위 거시 산출물에 영향 없도록 continue-on-error.
        continue-on-error: true
        env:
          VERITY_MODE: prod
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}   # EPS 서프라이즈 보강용, 없으면 가격 관측만
        run: python -m api.collectors.us_demand_chain

      - name: Upload to private bucket (macro_synthesis 만)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/upload_operator_data_to_supabase.py --only macro_synthesis

      - name: Commit ledgers (RULE 4 — 거시 산출물은 gitignore 로 봉인 유지)
        if: always()
        run: |
          # 🚨 이 워크플로의 거시 산출물(크라운주얼)은 .gitignore 로 커밋이 원천 차단되어 있다.
          #   여기서 커밋하는 것은 **장부뿐**:
          #     · llm_cost.jsonl        가장 비싼 LLM 호출의 비용 관측(2026-08-06)
          #     · us_demand_chain.*     미국 수요 체인 관측 원장 + 최신 스냅샷(2026-08-07).
          #       스냅샷을 커밋해야 뒤에 도는 daily_analysis_full(KST 16:07)의 체크아웃이
          #       읽어 리포트 프롬프트에 주입할 수 있다. 미add 시 rebase 거부 사고도 예방.
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/metadata/llm_cost.jsonl data/observations/us_demand_chain.jsonl data/us_demand_chain.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "💰 장부 — 거시 분석기 · 미국 수요 체인 관측"
          for i in 1 2 3 4 5 6; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin main && git push origin main; then exit 0; fi
            sleep $(( i * 7 + RANDOM % 15 ))
          done
          echo "::warning::장부 push 실패 — 다음 run 에서 누적 재시도"
