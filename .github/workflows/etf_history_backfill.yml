name: ETF History Backfill

# ETF 과거 시계열 백필 — KRX etf_bydd_trd 를 거래일별로 거슬러 축적(1콜=그날 전 종목).
#   초기 채움 = workflow_dispatch 로 회차 반복(기본 40거래일/회 → 250일이면 약 7회).
#   유지 = 주 1회(월 06:20 KST). 매일 돌리면 1,150개 파일이 매일 재기록돼 커밋이 무거워짐.
# 🚨 RULE 4 — 신규 산출 경로(data/etf_hist/) git add 명시.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "과거 날짜 응답 여부만 확인(쓰기 없음)"
        type: boolean
        default: false
      max_days:
        description: "이번 회차 거래일 수"
        default: "40"
      horizon:
        description: "백필 목표 거래일(≈1년=250)"
        default: "250"
      sleep_sec:
        description: "콜 간 대기(초) — KRX 스로틀 회피. 실측 0.4s 는 과속"
        default: "1.0"
  schedule:
    - cron: "20 21 * * 0" # 월 06:20 KST

# 🚨 데이터 커밋 push 필수 — 없으면 github-actions[bot] 403 으로 수집분이 전량 유실됨
#   (2026-07-27 실사고: 151거래일 수집 후 push 403, 커밋은 로컬에만 남아 폐기).
permissions:
  contents: write

concurrency:
  group: etf-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        # 🚨 형제 워크플로(bond_etf_analysis · crypto_collect)와 동일하게 requirements.txt 전체.
        #   api.config 가 python-dotenv 를 import 하는데 requests 만 깔아 ModuleNotFoundError 로
        #   첫 프로브가 죽었음(2026-07-27). CLAUDE.md 워크플로 체크리스트 6번(의존성 정합) 사례.
        run: pip install -r requirements.txt

      - name: Probe (과거 날짜 제공 여부)
        if: ${{ inputs.probe == true }}
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python scripts/etf_history_backfill.py --probe

      - name: Backfill
        if: ${{ inputs.probe != true }}
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          # 0.4s 로 250일을 연속 호출하니 약 99일이 빈 응답(스로틀 추정) → 기본 1.0s
          ETF_HIST_SLEEP: ${{ inputs.sleep_sec || '1.0' }}
        run: |
          python scripts/etf_history_backfill.py \
            --max-days "${{ inputs.max_days || '40' }}" \
            --horizon "${{ inputs.horizon || '250' }}"

      - name: Commit
        if: ${{ inputs.probe != true }}
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/etf_hist || true
          if git diff --cached --quiet; then
            echo "변경 없음 — commit skip"
            exit 0
          fi
          git commit -m "📈 etf_hist 백필 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          # 🚨 push race 재시도 — main 은 자동 데이터 커밋으로 약 7분마다 움직여서
          #   rebase 와 push 사이에 또 앞서감(2026-07-27 실사고: 248거래일 수집분 rejected 로 폐기).
          #   형제 워크플로 bond_etf_analysis 와 동일한 5회 백오프 패턴.
          PUSHED=false
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              PUSHED=true
              break
            fi
            echo "Push attempt $i failed, retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::5회 push 전부 실패 — 수집분 유실"
            exit 1
          fi
