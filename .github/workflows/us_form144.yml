name: US Form 144 (insider sale notices)

# 2026-08-09 신설 — 미사용 SEC 축 채움(커버리지 점검 후속).
# Form 4 는 내부자가 **판 뒤에** 나온다. Form 144 는 팔기 **전에** 낸다 — 시점이 반대라
# Form 4 로 대체되지 않는 별개 축이다. 오퍼레이터 판단 재료(사전 매도 압력).
# 비용: 무료 (SEC EDGAR, UA 연락처만). SEC 10 req/s 준수 + wall-clock budget 자기 제한.
#
# 7축 audit (2026-08-09):
#   env    = 없음. SEC UA 는 us_insider_trades_public_builder.SEC_UA 상수(연락처 포함)를 import
#            해서 쓴다 — 형제 워크플로(us_insider_trades)와 동일. 쓰지도 않을 시크릿을 env 에
#            얹지 않는다([[feedback_env_registration_with_usage_proof]] 죽은 등록 금지)
#   push   = data/ 만 commit → RULE 2 무관(vercel-api 외부, ignoreCommand 자동 skip)
#   concur = 전용 group (SEC 호출이 us_insider 와 겹치지 않게 시간대도 분리)
#   cron   = 주 3회 UTC 20:30 → KST 05:30 화·목·토. us_insider(UTC 04:00)와 비충돌
#   KIS    = 무관
#   pip    = requirements.txt (requests 기등록, 신규 의존 0)
#   RULE 8 = 수동 dispatch N=1 + 다음 정기 N=2. 산출 **건수** 확인 의무

on:
  schedule:
    - cron: '30 20 * * 1,3,5'
  workflow_dispatch:
    inputs:
      max_seconds:
        description: 'wall-clock budget (기본 1800s = 30분)'
        required: false
        default: '1800'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: verity-us-form144
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # budget 1800s(30분) + checkout/install/commit 여유

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build US Form 144 (매도 예정 신고)
        # 전 유니버스 rotation + carry-forward. RULE 7 = 공시 사실만(점수·신호 0).
        # 🚨 산출 0건이면 빌더가 exit 1 — 조용한 전량 실패 차단.
        env:
          US_FORM144_MAX_SECONDS: ${{ github.event.inputs.max_seconds || '1800' }}
        run: python -m api.builders.us_form144_public_builder

      - name: Commit data/us_form144.json
        # [[feedback_cron_commit_author_github_match]] gywns0126@gmail.com (GitHub 검증)
        # [[feedback_data_collection_verification_mandatory]] specific path commit
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/us_form144.json
          if git diff --staged --quiet; then
            echo "[us_form144] no changes"
            exit 0
          fi
          TODAY_KST=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git commit -m "📄 us_form144 ${TODAY_KST}"
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin "$BRANCH" --quiet
            if git rebase -X ours "origin/$BRANCH" --quiet && git push origin "HEAD:$BRANCH" --quiet; then
              echo "[us_form144] push 완료 (시도 $i)"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::push 5회 실패"
          exit 1
