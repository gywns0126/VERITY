# 수출·HS 매핑 파이프라인 — 일 1회 (무역통계는 월 단위, Gemini/관세청 호출 절약)
name: Export Trade Pipeline (Daily)

on:
  schedule:
    # 월~금 06:00 UTC ≈ KST 15:00 — verity-data-write group 한산 슬롯 (2026-05-05 정정).
    # 4/24~5/5 동안 schedule 08:15 + 다른 group 워크플로 큐 충돌로 7/8 cancelled.
    # daily_analysis */15 01-05 마지막 (05:45) 이후 + daily_analysis_full (07:00) 전 1h 윈도우.
    # export_trade → trade_analysis.json 갱신 → daily_analysis 새벽(23:30~) 사이클이 읽음.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

# Node.js 24 강제 — 2026-06-02 GitHub Node 20 deprecation 대비 (2026-05-07)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  # WARN-17: data/* 를 쓰는 모든 워크플로를 단일 그룹으로 직렬화
  group: verity-data-write
  cancel-in-progress: false

jobs:
  export-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run export trade pipeline
        env:
          # 🚨 VERITY_MODE 기본값 = dev = **LLM 호출이 mock 으로 대체**된다. 이 한 줄이
          #   없어서 [2/4] Gemini HS 매핑이 늘 0건이었고, 그 결과 trade_analysis.json 이
          #   stocks=[] 로만 발행됐다(git 이력 전 커밋이 0건 = 한 번도 내용을 낸 적 없음).
          #   키(GEMINI/PUBLIC_DATA)는 처음부터 다 있었다 — 소스가 아니라 배선 문제였다.
          #   2026-08-07 발견: shadow monitor 가 이 스트림을 유일한 알람으로 물고 있었는데
          #   "데이터를 못 구한다" 로 오독하고 폐기할 뻔했다. macro_synthesis.yml 이 같은
          #   함정에 "default dev = mock — 실호출 위해 명시" 주석을 남긴 것과 동일 사례.
          VERITY_MODE: prod
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY || vars.KRX_API_KEY }}
          KRX_OPENAPI_KEY: ${{ secrets.KRX_API_KEY || vars.KRX_API_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          CUSTOMS_TRADE_BASE_CNTY: ${{ vars.CUSTOMS_TRADE_BASE_CNTY || 'ZZ' }}
          CUSTOMS_TRADE_SURGE_COUNTRIES: ${{ vars.CUSTOMS_TRADE_SURGE_COUNTRIES || 'CN,US,VN' }}
          CUSTOMS_TRADE_SURGE_MOM_PCT: ${{ vars.CUSTOMS_TRADE_SURGE_MOM_PCT || '15' }}
          PYTHONUNBUFFERED: "1"
        run: python -m api.workflows.export_trade_pipeline

      - name: Commit trade JSON
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/trade_analysis.json data/hscode_mapping.json
          git add data/metadata/llm_cost.jsonl 2>/dev/null || true   # RULE 4 — LLM 비용 장부(미add 시 rebase 거부)
          HOUR_KST=$(TZ=Asia/Seoul date +%H:%M)
          git diff --staged --quiet || git commit -m "📦 수출·HS 매핑 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d) ${HOUR_KST}"
          BRANCH="${{ github.ref_name }}"
          PUSHED=false
          # 재시도 8회 + 지터 (2026-08-06 실패 fix) — main 에 push 하는 워크플로가 56개,
          # 봇 커밋 하루 292개. 고정 간격 재시도는 여러 워크플로가 같은 리듬으로 재충돌한다.
          for i in 1 2 3 4 5 6 7 8; do
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin "$BRANCH" && git push origin "$BRANCH"; then
              PUSHED=true
              break
            fi
            WAIT=$(( i * 7 + RANDOM % 15 ))
            echo "Push attempt $i failed, retrying in ${WAIT}s (jittered)..."
            sleep "$WAIT"
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::All 8 push attempts failed (main 경합) — 다음 스케줄에서 재시도"
            exit 1
          fi

      - name: Publish hot data to VERITY-data
        if: always()
        uses: ./.github/actions/publish-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.VERITY_DATA_PAT }}
          blob_token: ${{ secrets.VERCEL_BLOB_TOKEN }}
