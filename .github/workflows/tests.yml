name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 수동 트리거 (워크플로우 페이지에서 즉시 실행 가능)
  workflow_dispatch:

# 동시 실행 캔슬 — 같은 브랜치에 PR push 가 빠르게 이어지면 이전 실행 중단
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Node.js 24 강제 — 2026-06-02 GitHub Node 20 deprecation 대비 (2026-05-07)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r server/requirements.txt
          pip install pytest pytest-cov

      # 🚨 2026-08-21 신설 — tsx 문법 게이트가 CI 에서 **한 번도 돈 적이 없었다**.
      #   `tests/test_tsx_syntax.py` 는 `node_modules` 가 없으면 사유를 남기고 skip 하는데,
      #   러너에는 node_modules 가 없어 매 run 이 `SKIPPED (esbuild(node_modules) 부재)` 였다.
      #   조용한 통과는 아니었지만 실질은 **로컬 전용 게이트**였다 — 그 게이트를 만든 계기가
      #   정확히 "로컬에서만 검사하다 깨진 컴포넌트가 라이브로 나간 것" 이라 앞뒤가 안 맞는다.
      #   (2026-08-19 PublicGlassboxTab 문법 파손 — 회귀 2,431건 전부 통과한 채 라이브 에러)
      #   esbuild 는 이미 package.json devDependencies 에 있다. 러너에 설치만 하면 게이트가 산다.
      - name: Setup Node 24 (tsx 문법 게이트용)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 🚨 `cache: npm` 을 쓰지 않는다 — lockfile 이 있어야 하는데 repo 에 없다.
          #   넣었다가 `Dependencies lock file is not found` 로 CI 가 죽었다(1차 시도 실패).

      - name: Install esbuild (tsx 문법 게이트용)
        # 🚨 `npm ci` 가 아니라 직접 설치다. 이유 = `.gitignore:10-11` 이 루트
        #   `package.json` / `package-lock.json` 을 **의도적으로** 제외한다
        #   (`/node_modules/` 와 함께 8~11행). 저장소 루트는 파이썬 프로젝트이고
        #   node 파일은 로컬 편의용이다. 그 결정을 뒤집는 것은 별건(PM 사안)이라
        #   워크플로가 도구를 자급한다.
        #   🚨 내 1차 커밋문 "esbuild 는 이미 package.json devDependencies 에 있다" 는
        #   **로컬 디스크를 저장소 상태로 읽은 것**이었다. CI 체크아웃에는 그 파일이 없다.
        # 버전 고정 = 재현성. 로컬은 ^0.28.1 이라 패치 수준에서 갈릴 수 있는데,
        # 문법 파싱 게이트라 그 차이는 판정에 영향이 없다.
        run: npm install --no-save --no-audit --no-fund esbuild@0.28.1

      - name: Syntax sanity (ast.parse on all .py)
        run: |
          python -c "
          import ast, pathlib, sys
          fail = []
          for p in pathlib.Path('.').rglob('*.py'):
              if any(seg in str(p) for seg in ('__pycache__', '.venv', 'node_modules')):
                  continue
              try:
                  ast.parse(p.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  fail.append(f'{p}: {e}')
          if fail:
              print('Syntax errors:')
              for f in fail: print(' -', f)
              sys.exit(1)
          print(f'OK: {sum(1 for _ in pathlib.Path(\".\").rglob(\"*.py\"))} .py files')
          "

      - name: Run pytest
        run: pytest tests/ -v --tb=short --color=yes
        env:
          # 일부 테스트가 conftest 에서 환경변수 default 사용 — 빈 값으로 충분
          VERITY_MODE: dev
