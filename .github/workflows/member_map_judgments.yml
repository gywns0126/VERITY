name: member-map-judgment-proposals

# Reuse the existing daily public collection; no new high-frequency cron.
# Only bounded public DART excerpts enter OpenAI. Results remain private/pending.
# Supabase's existing global reservation/result RPCs survive runner replacement.
on:
  workflow_run:
    workflows: ['kr-company-facts-backfill']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Private bounded proposals, or publish the explicitly reviewed public artifact without AI'
        default: 'judge'
        type: choice
        options: ['judge', 'publish-reviewed', 'publish-contracts']
      artifact_sha256:
        description: 'Exact reviewed public artifact SHA256 (publish-reviewed only)'
        type: string
      replace_sha256:
        description: 'Exact current public bytes authorized for replacement (publish-reviewed only)'
        type: string
      period_documents:
        description: '공개 원문 documents JSON 배열, 최대 8개 (publish-reviewed만, registry와 함께)'
        type: string
      period_registry:
        description: '공개 issuer ID별 name/corp_code JSON 객체 (publish-reviewed만, documents와 함께)'
        type: string
      limit:
        description: 'Maximum new paid attempts; cached answers do not spend again'
        default: '3'
        type: choice
        options: ['1', '3', '5', '10']

permissions:
  contents: read

concurrency:
  group: verity-member-map-judgment-proposals
  cancel-in-progress: false

jobs:
  judge:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'judge') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only source plan
        run: python3 scripts/member-map/run-company-judgments.py --limit 1
      - name: Run bounded private judgment proposals
        env:
          PORTFOLIO_AI_OPERATING_ENABLED: '1'
          PORTFOLIO_AI_LEDGER: supabase
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JUDGMENT_LIMIT: ${{ inputs.limit || '3' }}
        run: |
          python3 scripts/member-map/run-company-judgments.py \
            --execute --limit "$JUDGMENT_LIMIT"
      # No cache/result upload or data commit: private Supabase owns responses.
      # General report-builder CI/VERCEL paid-worker guards are not removed.

  publish-reviewed:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-reviewed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare existing contract validation dependency
        run: python3 -m pip install 'beautifulsoup4>=4.12.0,<5.0.0'
      - name: 공개 보고기간 원문 준비
        env:
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          REPLACE_SHA256: ${{ inputs.replace_sha256 }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import re
          import tempfile
          import urllib.parse
          import urllib.request

          def reject():
              raise ValueError("public-period-preparation-rejected")

          def strict_json(raw, limit):
              if not 0 < len(raw.encode("utf-8")) <= limit:
                  reject()
              def unique(pairs):
                  value = {}
                  for key, item in pairs:
                      if key in value:
                          reject()
                      value[key] = item
                  return value
              def finite(value):
                  number = float(value)
                  if not math.isfinite(number):
                      reject()
                  return number
              return json.loads(raw, object_pairs_hook=unique, parse_float=finite,
                                parse_constant=lambda _: reject())

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  reject()

          def prepare(environ, *, opener=None):
              # step env/run 헤더에 원문을 노출하지 않고 기존 dispatch 파일만 읽는다.
              with open(environ["GITHUB_EVENT_PATH"], "rb") as stream:
                  event_body = stream.read(1_000_001)
              inputs = strict_json(event_body.decode("utf-8"), 1_000_000)["inputs"]
              if type(inputs) is not dict:
                  reject()
              raw_documents = inputs.get("period_documents", "")
              raw_registry = inputs.get("period_registry", "")
              if type(raw_documents) is not str or type(raw_registry) is not str:
                  reject()
              if bool(raw_documents.strip()) != bool(raw_registry.strip()):
                  reject()
              if not raw_documents.strip():
                  return  # legacy 유지; v3의 원문 누락은 기존 validator가 거부한다.
              documents = strict_json(raw_documents, 80_000)
              registry = strict_json(raw_registry, 256_000)
              # 순수 공개 문서 검사를 재사용한다. 키·provider·worker를 읽지 않는다.
              from api.intelligence.portfolio_ai_public import _judgment_sources, _legal_name, _text
              sources = _judgment_sources(documents)
              if type(registry) is not dict or set(registry) != {d["issuer_id"] for d in documents}:
                  reject()
              for document in documents:
                  issuer = registry[document["issuer_id"]]
                  if (type(issuer) is not dict or set(issuer) != {"name", "corp_code"}
                          or type(issuer["corp_code"]) is not str
                          or not re.fullmatch(r"[0-9]{8}", issuer["corp_code"], re.ASCII)
                          or _legal_name(_text(issuer["name"], 160)).casefold()
                          != _legal_name(document["issuer_name"]).casefold()):
                      reject()
              expected = environ.get("ARTIFACT_SHA256", "")
              if any(not re.fullmatch(r"[a-f0-9]{64}", value)
                     for value in (expected, environ.get("REPLACE_SHA256", ""))):
                  reject()
              with open("data/member_map_ai_candidates.json", "rb") as stream:
                  body = stream.read(2_000_001)
              if len(body) > 2_000_000 or hashlib.sha256(body).hexdigest() != expected:
                  reject()
              artifact = strict_json(body.decode("utf-8"), 2_000_000)
              rows = artifact.get("company_judgments", {}).get("judgments", [])
              if type(rows) is not list or len(rows) > 16 or any(type(row) is not dict for row in rows):
                  reject()
              rows = [row for row in rows if "period_context_v3" in row]
              if not rows or {row["source_id"] for row in rows} != set(sources):
                  reject()
              archive_hashes = {}
              for row in rows:
                  source = sources[row["source_id"]]
                  context = row["period_context_v3"]
                  if (type(context) is not dict or context.get("schema") != "reported-customer-period-v1"
                          or context.get("source_id") != row["source_id"]
                          or context.get("company_id") != row["company_id"]
                          or source["issuer_id"] != row["company_id"]
                          or context.get("counterparty_id") != row["counterparty_id"]
                          or row["counterparty_id"] not in {p["id"] for p in source["counterparties"]}
                          or row["source_url"] != source["url"] or row["published_on"] != source["as_of"]
                          or context.get("source_version") != row["source_version"]
                          or row["source_version"] != source["source_version"]
                          or context.get("corp_code") != registry[row["company_id"]]["corp_code"]):
                      reject()
                  digest = context.get("archive_sha256")
                  if (type(digest) is not str or not re.fullmatch(r"[a-f0-9]{64}", digest)
                          or archive_hashes.get(row["source_id"], digest) != digest):
                      reject()
                  archive_hashes[row["source_id"]] = digest
              # 전체 입력 결속 이후에만 키를 읽고, 고정 원문 endpoint를 한 번씩 호출한다.
              key = environ.get("DART_API_KEY", "")
              if not key:
                  reject()
              runner_temp = Path(environ["RUNNER_TEMP"])
              github_env = Path(environ["GITHUB_ENV"])
              if any("\n" in str(path) or "\r" in str(path) for path in (runner_temp, github_env)):
                  reject()
              directory = Path(tempfile.mkdtemp(prefix="member-map-period-", dir=runner_temp))
              transport = opener or urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              for source_id, digest in archive_hashes.items():
                  receipt = source_id.removeprefix("source:dart:")
                  if not re.fullmatch(r"[0-9]{14}", receipt, re.ASCII):
                      reject()
                  url = "https://opendart.fss.or.kr/api/document.xml?" + urllib.parse.urlencode(
                      {"crtfc_key": key, "rcept_no": receipt})
                  with transport.open(urllib.request.Request(url), timeout=25) as response:
                      if response.status != 200 or response.geturl() != url:
                          reject()
                      length = response.headers.get("Content-Length")
                      if length is not None and (not re.fullmatch(r"[0-9]+", length, re.ASCII)
                              or not 0 < int(length) <= 4 * 1024 * 1024):
                          reject()
                      archive = response.read(4 * 1024 * 1024 + 1)
                  if (not 0 < len(archive) <= 4 * 1024 * 1024
                          or not archive.startswith(b"PK\x03\x04")
                          or hashlib.sha256(archive).hexdigest() != digest):
                      reject()
                  with (directory / ("dart-document-" + receipt + ".zip")).open("xb") as stream:
                      stream.write(archive)
              input_path = directory / "period-input.json"
              registry_path = directory / "issuer-registry.json"
              for path, value in ((input_path, {"documents": documents}), (registry_path, registry)):
                  with path.open("x", encoding="utf-8") as stream:
                      json.dump(value, stream, ensure_ascii=False, allow_nan=False)
              with github_env.open("a", encoding="utf-8") as stream:
                  stream.write("PERIOD_INPUT_PATH=" + str(input_path) + "\n"
                               "PERIOD_SOURCE_DIR=" + str(directory) + "\n"
                               "PERIOD_REGISTRY_PATH=" + str(registry_path) + "\n")

          if __name__ == "__main__":
              try:
                  prepare(os.environ)
              except Exception:
                  raise SystemExit("public-period-preparation-rejected")
          PY
      - name: Validate exact reviewed projection offline
        env:
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          REPLACE_SHA256: ${{ inputs.replace_sha256 }}
        run: |
          period_args=()
          if [[ -n "${PERIOD_INPUT_PATH:-}" ]]; then
            period_args=(--period-input "$PERIOD_INPUT_PATH" --period-source-dir "$PERIOD_SOURCE_DIR" --issuer-registry-path "$PERIOD_REGISTRY_PATH")
          fi
          node scripts/member-map/upload-ai-candidates.cjs \
            --artifact data/member_map_ai_candidates.json --artifact-sha256 "$ARTIFACT_SHA256" \
            --source-dir data --replace-sha256 "$REPLACE_SHA256" "${period_args[@]}"
      - name: Install pinned public storage SDK
        run: npm install --prefix "$RUNNER_TEMP/member-map-blob" --no-save --ignore-scripts --no-audit --no-fund @vercel/blob@2.4.1
      - name: Publish one conditional public artifact and verify canonical readback
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.VERCEL_BLOB_TOKEN }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          REPLACE_SHA256: ${{ inputs.replace_sha256 }}
        run: |
          period_args=()
          if [[ -n "${PERIOD_INPUT_PATH:-}" ]]; then
            period_args=(--period-input "$PERIOD_INPUT_PATH" --period-source-dir "$PERIOD_SOURCE_DIR" --issuer-registry-path "$PERIOD_REGISTRY_PATH")
          fi
          NODE_PATH="$RUNNER_TEMP/member-map-blob/node_modules" node scripts/member-map/upload-ai-candidates.cjs \
            --artifact data/member_map_ai_candidates.json --artifact-sha256 "$ARTIFACT_SHA256" \
            --source-dir data --replace-sha256 "$REPLACE_SHA256" "${period_args[@]}" --upload

  publish-contracts:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the existing source validator dependency
        run: python3 -m pip install 'beautifulsoup4>=4.12.0,<5.0.0'
      - name: Validate exact source-bound enrichment offline
        env:
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          REPLACE_SHA256: ${{ inputs.replace_sha256 }}
        run: |
          node -e 'const fs=require("node:fs"),os=require("node:os"),path=require("node:path"); if(!/^[a-f0-9]{64}$/.test(process.env.REPLACE_SHA256||"")) throw Error("invalid prior hash"); const dir=fs.mkdtempSync(path.join(os.tmpdir(),"contract-review-")); try { const r=require("./scripts/member-map/publish-source-filter.cjs").publishSourceFilter({source:"data/member_map_auto_evidence.json",publishDirectory:dir}); if(r.sha256!==process.env.ARTIFACT_SHA256) throw Error("unexpected artifact hash"); console.log(JSON.stringify({sha256:r.sha256,network_calls:0})); } finally { fs.rmSync(dir,{recursive:true,force:true}); }'
      - name: Install pinned public storage SDK
        run: npm install --prefix "$RUNNER_TEMP/member-map-blob" --no-save --ignore-scripts --no-audit --no-fund @vercel/blob@2.4.1
      - name: Publish only the explicitly reviewed contract enrichment
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.VERCEL_BLOB_TOKEN }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          REPLACE_SHA256: ${{ inputs.replace_sha256 }}
        run: |
          NODE_PATH="$RUNNER_TEMP/member-map-blob/node_modules" node scripts/member-map/upload-public-source-filter.cjs \
            data/member_map_auto_evidence.json --artifact-sha256 "$ARTIFACT_SHA256" --replace-sha256 "$REPLACE_SHA256"
