# VERITY 리포트 v2 자동 생성 cron — 6단계 × 관리자/일반인 = 12개 PDF
#
# 매일 KST 22:00 (UTC 13:00) 한 번 실행 → 날짜 검사 후 해당 단위 자동 실행:
#   - 매일: Daily admin + public
#   - 월요일: Weekly admin + public
#   - 매월 1일: Monthly admin + public
#   - 1/4/7/10월 1일: Quarterly admin + public
#   - 1/7월 1일: Semi-Annual admin + public
#   - 1월 1일: Annual admin + public
#
# 결과: data/reports/verity_<period>_<kind>.pdf (latest 별칭) + timestamp 버전
# git commit + push → Framer VerityReport 컴포넌트가 GitHub raw URL 다운로드

name: Reports v2 Cron

on:
  # Vercel Cron 매분 → UTC 13:07 시점에 reports_v2 dispatch.
  # GH schedule (5/10 14:21 마지막 발화 후 5/11 13:07 미발화 확인됨) 폐기.
  repository_dispatch:
    types: [reports_v2]
  workflow_dispatch:
    inputs:
      modes:
        description: '실행할 모드 (콤마 구분, 예: daily_admin_v2,daily_public_v2). 비우면 날짜 자동 검사'
        required: false
        default: ''
        type: string

# Node.js 24 강제 — 2026-06-02 GitHub Node 20 deprecation 대비 (2026-05-07)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  # daily_analysis_full 와 같은 그룹 — data/* 직렬화
  group: verity-data-write
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure Korean font for PDF
        run: |
          mkdir -p api/reports/fonts
          if [ ! -f api/reports/fonts/NanumGothic.ttf ]; then
            curl -sL -o api/reports/fonts/NanumGothic.ttf \
              "https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Regular.ttf"
            curl -sL -o api/reports/fonts/NanumGothicBold.ttf \
              "https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Bold.ttf"
          fi

      - name: Detect modes from date
        id: detect
        run: |
          MANUAL="${{ inputs.modes }}"
          if [ -n "$MANUAL" ]; then
            echo "modes=$MANUAL" >> $GITHUB_OUTPUT
            echo "  → 수동: $MANUAL"
            exit 0
          fi

          # KST 기준 날짜 검사
          DOW=$(TZ=Asia/Seoul date +%u)   # 1=월 ... 7=일
          DOM=$(TZ=Asia/Seoul date +%-d)  # 1~31
          MONTH=$(TZ=Asia/Seoul date +%-m) # 1~12

          MODES="daily_admin_v2,daily_public_v2"

          # 월요일이면 weekly 추가
          if [ "$DOW" = "1" ]; then
            MODES="$MODES,weekly_admin_v2,weekly_public_v2"
          fi

          # 매월 1일이면 monthly 추가
          if [ "$DOM" = "1" ]; then
            MODES="$MODES,monthly_admin_v2,monthly_public_v2"
          fi

          # 1/4/7/10월 1일이면 quarterly 추가
          if [ "$DOM" = "1" ] && { [ "$MONTH" = "1" ] || [ "$MONTH" = "4" ] || [ "$MONTH" = "7" ] || [ "$MONTH" = "10" ]; }; then
            MODES="$MODES,quarterly_admin_v2,quarterly_public_v2"
          fi

          # 1/7월 1일이면 semi 추가
          if [ "$DOM" = "1" ] && { [ "$MONTH" = "1" ] || [ "$MONTH" = "7" ]; }; then
            MODES="$MODES,semi_admin_v2,semi_public_v2"
          fi

          # 1월 1일이면 annual 추가
          if [ "$DOM" = "1" ] && [ "$MONTH" = "1" ]; then
            MODES="$MODES,annual_admin_v2,annual_public_v2"
          fi

          echo "modes=$MODES" >> $GITHUB_OUTPUT
          echo "  KST 기준: DOW=$DOW DOM=$DOM MONTH=$MONTH"
          echo "  → 자동: $MODES"

      - name: Run report generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          GEMINI_MODEL_DEFAULT: ${{ vars.GEMINI_MODEL_DEFAULT || 'gemini-2.5-flash' }}
          GEMINI_MODEL_CRITICAL: ${{ vars.GEMINI_MODEL_CRITICAL || 'gemini-2.5-pro' }}
          VERITY_MODE: 'prod'
        run: |
          IFS=',' read -ra MODE_ARR <<< "${{ steps.detect.outputs.modes }}"
          for MODE in "${MODE_ARR[@]}"; do
            MODE=$(echo "$MODE" | xargs)  # trim
            if [ -z "$MODE" ]; then continue; fi
            echo ""
            echo "═══════════════════════════════════════════════════════════"
            echo "  RUN: $MODE"
            echo "═══════════════════════════════════════════════════════════"
            ANALYSIS_MODE="$MODE" python api/main.py || echo "::warning::$MODE 실패 (계속 진행)"
          done

      - name: List generated PDFs
        run: |
          echo "=== Generated PDFs ==="
          ls -la data/reports/*.pdf 2>/dev/null | tail -30 || echo "(no PDFs)"

      - name: Upload PDFs to Supabase Storage
        # 2026-05-03: data/.gitignore 가 reports/ 를 잡아 git push 로는 PDF 가
        # GitHub 에 업로드되지 않음. Supabase Storage private bucket 으로 올려서
        # vercel-api `/api/reports` 가 signed URL 로 서빙.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY 미설정 — Storage 업로드 스킵"
          else
            python scripts/upload_reports_to_supabase.py || echo "::warning::Storage 업로드 일부 실패"
          fi

      - name: Commit & push
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          # data/reports/ 는 .gitignore 됨 (위 Storage upload 단계가 산출물 경로).
          # 🚨 RULE 4 — 좁은 add 금지. 2026-08-13·14 사고: `data/metadata/ data/history/` 만
          #   스테이징해서 api/main.py 가 data/ 루트에 쓴 파일(telegram_volume.jsonl 등)이
          #   unstaged 로 남았고, `git pull --rebase` 가 "You have unstaged changes" 로 거부해
          #   재시도 8회가 전부 같은 이유로 실패했다. 경합이 아니라 작업트리 오염이었다.
          #   api/main.py 를 도는 나머지 3개 워크플로(daily_analysis_full / daily_analysis /
          #   daily_realtime)는 전부 broad add 라 무사했다 — 여기만 예외였다.
          git add data/
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          MODES="${{ steps.detect.outputs.modes }}"
          git diff --staged --quiet || git commit -m "📑 리포트 v2 자동 생성 ${DATE} (${MODES})"
          # 스테이징 밖 잔여 변경 = rebase 차단 요인. 남아 있으면 신고하고 치운다
          # (조용히 8회 실패하는 대신 원인을 로그에 남긴다).
          DIRTY=$(git status --porcelain --untracked-files=no)
          if [ -n "$DIRTY" ]; then
            echo "::warning::스테이징 밖 변경 잔존 — rebase 전 stash 처리"
            echo "$DIRTY"
            git stash push --quiet --message "reports_v2 pre-rebase residual" || true
          fi
          BRANCH="${{ github.ref_name }}"
          PUSHED=false
          # 재시도 8회 + 지터 (2026-08-06 실패 fix) — main 에 push 하는 워크플로가 56개,
          # 봇 커밋 하루 292개. 고정 간격 재시도는 여러 워크플로가 같은 리듬으로 재충돌한다.
          for i in 1 2 3 4 5 6 7 8; do
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            if git pull --rebase --autostash -X theirs origin "$BRANCH" && git push origin "$BRANCH"; then
              PUSHED=true
              break
            fi
            WAIT=$(( i * 7 + RANDOM % 15 ))
            echo "Push attempt $i failed, retrying in ${WAIT}s (jittered)..."
            sleep "$WAIT"
          done
          if [ "$PUSHED" != "true" ]; then
            # 원인 구분 — 작업트리가 더러우면 재시도로 절대 안 풀린다(8회 전부 즉시 실패).
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "::error::push 실패 — 작업트리 오염(경합 아님). 아래 파일이 add 범위 밖이다:"
              git status --porcelain --untracked-files=no
            else
              echo "::error::All 8 push attempts failed (main 경합) — 다음 스케줄에서 재시도"
            fi
            exit 1
          fi

      - name: Publish hot data to VERITY-data
        if: always()
        uses: ./.github/actions/publish-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.VERITY_DATA_PAT }}
          blob_token: ${{ secrets.VERCEL_BLOB_TOKEN }}
