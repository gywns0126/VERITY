name: Stock Analysis Pipeline (Realtime — KR & US)

# 5/11 분리: daily_analysis.yml 의 realtime/realtime_us cron 만 이관.
# 이유: verity-data-write 단일 그룹 11 워크플로 공유 → 5분 간격 trigger 대부분 superseded (cancelled).
# 같은 group `verity-realtime` 안에서만 직렬화 + cancel-in-progress: false 큐잉.
# 같은 데이터 파일을 daily_analysis (quick) 가 동시에 쓸 가능성은 git rebase --theirs 5회 retry 가드.

on:
  # 2026-05-12 audit fix (HIGH #1):
  # GH schedule 16+ 라인 폐기. project_dispatch_chain.md 결정 이행 (5/11 박힌 후 잔존).
  # 이전 결함: schedule + dispatch 동시 활성 → 자정 race + 5/12 새벽 KIS 4 토큰 race 사고 잠재 재발.
  # 새 구조: Vercel Cron 매분 → dispatch_pulse 가 minute % 30 == 0 슬롯에서 daily_realtime 발화 (30분당 1회).
  # GH schedule silent skip 회피 + dispatch chain 단일 통로 (price_pulse / hourly_pulse 와 동일 패턴).
  repository_dispatch:
    types: [daily_realtime]
  workflow_dispatch:
    inputs:
      mode:
        description: '분석 모드 (realtime / realtime_us) — 비우면 cron 으로 자동 판별'
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # 🚨 RULE 1 — GH Actions 단일 발급원 (PM 2026-05-31). 발급 직후 Supabase publish (Railway/Vercel 소비).
  KIS_SHARED_TOKEN: "1"
  # 2026-06-10: stdout 즉시 flush. watchdog SIGTERM 시 buffering 으로 hang step 이 로그에서
  #   가려지던 관측성 갭 해소 (6/10 00:30 US realtime SIGTERM 진단 시 hang step 추정만 가능했음).
  PYTHONUNBUFFERED: "1"

permissions:
  contents: write

concurrency:
  # 분리: 5분 간격 realtime 전용 그룹. verity-data-write 와 격리.
  # cancel-in-progress: false 로 큐잉 — JSON 손상 + VAMS lost-update 방지.
  group: verity-realtime
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 현재 날짜 (KST)
        id: date
        run: echo "today=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: KIS 토큰 캐시 복원
        uses: actions/cache@v4
        with:
          path: ~/.cache/verity_kis_token.json
          key: kis-token-v2-${{ runner.os }}-${{ steps.date.outputs.today }}
          restore-keys: |
            kis-token-v2-${{ runner.os }}-

      - name: Check optional trade/patent API secrets
        env:
          KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY || vars.KIPRIS_API_KEY }}
          KIPRIS_ACCESS_KEY: ${{ secrets.KIPRIS_ACCESS_KEY || vars.KIPRIS_ACCESS_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY || vars.PUBLIC_DATA_API_KEY }}
        run: |
          if [ -z "$KIPRIS_API_KEY" ] && [ -z "$KIPRIS_ACCESS_KEY" ]; then
            echo "::warning::KIPRIS: KIPRIS_API_KEY 또는 KIPRIS_ACCESS_KEY 없음"
          fi
          if [ -z "$PUBLIC_DATA_API_KEY" ]; then
            echo "::warning::관세청: PUBLIC_DATA_API_KEY 없음"
          fi
          KRX_API_KEY="${{ secrets.KRX_API_KEY || vars.KRX_API_KEY }}"
          if [ -z "$KRX_API_KEY" ]; then
            echo "::warning::KRX: KRX_API_KEY 없음"
          fi

      - name: Ensure Korean font for PDF
        run: |
          mkdir -p api/reports/fonts
          if [ ! -f api/reports/fonts/NanumGothic.ttf ]; then
            curl -sL -o api/reports/fonts/NanumGothic.ttf \
              "https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Regular.ttf"
            curl -sL -o api/reports/fonts/NanumGothicBold.ttf \
              "https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Bold.ttf"
          fi

      - name: Detect schedule mode
        id: detect_mode
        run: |
          CRON="${{ github.event.schedule }}"
          MANUAL="${{ github.event.inputs.mode }}"
          if [ -n "$MANUAL" ]; then
            echo "mode=$MANUAL" >> $GITHUB_OUTPUT
          elif [ "$CRON" = "30,35,40,45,50,55 23 * * 0-4" ] || \
               [ "$CRON" = "0,5,10,15,20,25 0 * * 1-5" ] || \
               [ "$CRON" = "30,45 0 * * 1-5" ] || \
               [ "$CRON" = "*/15 1-5 * * 1-5" ] || \
               [ "$CRON" = "0,5,10,15,20,25,30,35,40 6 * * 1-5" ] || \
               [ "$CRON" = "45,50,55 6 * * 1-5" ] || \
               [ "$CRON" = "20,40 8-15 * * 1-5" ] || \
               [ "$CRON" = "20,40 16-22 * * 0-4" ]; then
            echo "mode=realtime" >> $GITHUB_OUTPUT
          elif [ "$CRON" = "7 13 * * 1-5" ] || \
               [ "$CRON" = "30 14 * * 1-5" ] || \
               [ "$CRON" = "0,30 15-20 * * 2-6" ] || \
               [ "$CRON" = "30,45 20 * * 2-6" ] || \
               [ "$CRON" = "25 12 * * 1-5" ] || [ "$CRON" = "35 12 * * 1-5" ] || \
               [ "$CRON" = "25 13 * * 1-5" ] || [ "$CRON" = "35 13 * * 1-5" ]; then
            echo "mode=realtime_us" >> $GITHUB_OUTPUT
          else
            # repository_dispatch 또는 매칭 안 된 cron — KST 시각 기반 fallback
            KST_HOUR=$(TZ=Asia/Seoul date +%H)
            if [ "$KST_HOUR" -ge 22 ] || [ "$KST_HOUR" -lt 6 ]; then
              echo "mode=realtime_us" >> $GITHUB_OUTPUT
            else
              echo "mode=realtime" >> $GITHUB_OUTPUT
            fi
          fi
          # F3: 휴장 직후 첫 거래일 + KR 개장 직전 (KST 08:30~09:25) → after_holiday flag
          AFTER_HOLIDAY=0
          KST_HM=$(TZ=Asia/Seoul date +%H%M)
          if [ "$CRON" = "30,35,40,45,50,55 23 * * 0-4" ] || [ "$CRON" = "0,5,10,15,20,25 0 * * 1-5" ] || \
             { [ -z "$CRON" ] && [ "$KST_HM" -ge 830 ] && [ "$KST_HM" -le 925 ]; }; then
            AFTER_HOLIDAY=$(python -c "from api.utils.market_calendar import is_first_trading_day_after_holiday, today_kst; print('1' if is_first_trading_day_after_holiday(today_kst(), 'KR') else '0')" 2>/dev/null || echo "0")
          fi
          echo "after_holiday=$AFTER_HOLIDAY" >> $GITHUB_OUTPUT

      - name: KIS preflight (issue + immediate lock push)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_OPENAPI_BASE_URL: ${{ secrets.KIS_OPENAPI_BASE_URL || vars.KIS_OPENAPI_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KIS_APP_KEY" ]; then
            echo "[KIS preflight] secrets 미설정 — skip"
            exit 0
          fi
          # 2026-05-30 RULE 1 시점 guard: KST 21-23시 = preflight skip
          # → kis_token_refresh.yml (23:45 KST) sole source 보장.
          # 사고 history: 5/27 23:08 / 5/28 22:11 / 5/29 22:31 — 매일 발급 시점 1.5h 이동 chronic.
          # 장 개장 직전 case (KST 08:30) preflight = 24h guard 그대로 작동 (보존).
          KST_HOUR=$(TZ=Asia/Seoul date +%H)
          KST_HOUR_NUM=$((10#$KST_HOUR))
          if [ "$KST_HOUR_NUM" -ge 21 ] && [ "$KST_HOUR_NUM" -lt 24 ]; then
            echo "[KIS preflight] KST ${KST_HOUR}시 (21-23) — skip (kis_token_refresh.yml 23:45 sole source)"
            exit 0
          fi
          python - <<'PYEOF'
          import sys, os
          sys.path.insert(0, os.getcwd())
          try:
              from api.trading.kis_broker import KISBroker
              broker = KISBroker()
              if not broker.is_configured:
                  print("[KIS preflight] 미설정 — skip")
                  sys.exit(0)
              # 2026-05-13 자정 race fix: date 비교 → 시각 기반 interval
              # 2026-05-29 RULE 1 정정: 23h → 24h (5/27 00:08+23:08 / 5/28 22:11 매일 알림 사고)
              if broker._is_recently_issued(hours=24):
                  print("[KIS preflight] 24h 이내 발급 — skip")
                  sys.exit(0)
              token = broker.authenticate(force_refresh=False)
              print(f"[KIS preflight] 발급 완료: {token[:8]}***")
          except Exception as e:
              print(f"[KIS preflight] 실패 (analysis step 에서 재시도): {e}")
              sys.exit(0)
          PYEOF

      - name: Daily lock immediate push (KIS [C])
        if: always()
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
        run: |
          if [ -z "$KIS_APP_KEY" ]; then
            echo "[lock push] KIS 미설정 — skip"
            exit 0
          fi
          if [ ! -f data/.kis_issued_date.txt ]; then
            echo "[lock push] 파일 없음 — preflight 발급 skip 케이스. 종료"
            exit 0
          fi
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/.kis_issued_date.txt
          git add data/metadata/llm_cost.jsonl 2>/dev/null || true   # RULE 4 — LLM 비용 장부(미add 시 rebase 거부)
          if git diff --staged --quiet; then
            echo "[lock push] 변화 없음 — origin 이미 동기"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git commit -m "🔐 KIS daily lock ${TODAY} (preflight realtime)"
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash -X ours origin "$BRANCH" && git push origin "$BRANCH"; then
              echo "[lock push] ✓ 성공 (시도 $i)"
              exit 0
            fi
            echo "[lock push] 시도 $i 실패 — 재시도"
            sleep $((i * 5))
          done
          echo "::warning::[lock push] 3회 실패 — 분석 끝 commit step 에서 재시도"

      - name: Run analysis
        env:
          # 🚨 VERITY_MODE 기본값 = dev = LLM 호출이 mock 으로 대체된다. 이 한 줄이 없어서
          #   **꼬리위험 알림(전쟁·대규모 재난 등)이 조용히 꺼져 있었다** — 2026-08-08 발견.
          #   MOCK CENSUS 가 매 실행 gemini.tail_risk 를 찍고 있었는데, 이는 LLM 을 매번
          #   호출한다는 뜻이 아니라 데코레이터가 **함수 전체**에 붙어 프리필터·쿨다운
          #   검사까지 통째로 스텁된다는 뜻이다(mock 반환값 None → 아무 알림도 안 나감).
          #
          #   비용: prod 에서는 3중 게이트가 실제로 작동해 호출이 드물다.
          #     ① 프리필터 — 지진/쓰나미/전쟁/미사일/도발/대형 산불/airstrike 등 키워드 매칭
          #     ② 쿨다운 12분  ③ severity 8+ 만 텔레그램 발송
          #   평시 호출 0, 재난·전쟁 헤드라인이 뜬 날에만 소수. 이 파이프라인의 LLM 호출은
          #   이것 하나뿐임을 최근 실행 5회 MOCK CENSUS 로 확인(gemini.tail_risk 단일 키).
          VERITY_MODE: prod
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          VAMS_INITIAL_CASH: ${{ vars.VAMS_INITIAL_CASH || '10000000' }}
          VAMS_MAX_PER_STOCK: ${{ vars.VAMS_MAX_PER_STOCK || '2000000' }}
          ANALYSIS_MODE: ${{ steps.detect_mode.outputs.mode }}
          ANALYSIS_AFTER_HOLIDAY: ${{ steps.detect_mode.outputs.after_holiday }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY || vars.KIPRIS_API_KEY }}
          KIPRIS_ACCESS_KEY: ${{ secrets.KIPRIS_ACCESS_KEY || vars.KIPRIS_ACCESS_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY || vars.PUBLIC_DATA_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY || vars.KRX_API_KEY }}
          KRX_OPENAPI_KEY: ${{ secrets.KRX_API_KEY || vars.KRX_API_KEY }}
          UNIVERSE_RAMP_UP_STAGE: "0"
          GEMINI_MODEL_CRITICAL: ${{ vars.GEMINI_MODEL_CRITICAL || 'gemini-2.5-pro' }}
          GEMINI_PRO_ENABLE: ${{ vars.GEMINI_PRO_ENABLE || '1' }}
          GEMINI_CRITICAL_TOP_N: ${{ vars.GEMINI_CRITICAL_TOP_N || '3' }}
          DEADMAN_FAIL_THRESHOLD: ${{ vars.DEADMAN_FAIL_THRESHOLD || '3' }}
          REPORT_SEND_HOUR_KST: ${{ vars.REPORT_SEND_HOUR_KST || '16' }}
          REPORT_SEND_MINUTE_KST: ${{ vars.REPORT_SEND_MINUTE_KST || '30' }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_TIER: ${{ vars.POLYGON_TIER || 'free' }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWSAPI_MAX_ARTICLES: ${{ vars.NEWSAPI_MAX_ARTICLES || '5' }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_OPENAPI_BASE_URL: ${{ secrets.KIS_OPENAPI_BASE_URL || vars.KIS_OPENAPI_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python api/main.py

      - name: Commit & push results
        run: |
          git config user.name "AI Stock Bot"
          git config user.email "gywns0126@gmail.com"
          git add data/
          HOUR_KST=$(TZ=Asia/Seoul date +%H:%M)
          MODE="${{ steps.detect_mode.outputs.mode }}"
          git diff --staged --quiet || git commit -m "📊 ${MODE} 업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d) ${HOUR_KST}"
          BRANCH="${{ github.ref_name }}"
          PUSHED=false
          # 재시도 8회 + 지터 (2026-08-06 실패 fix) — main 에 push 하는 워크플로가 56개,
          # 봇 커밋 하루 292개. 고정 간격 재시도는 여러 워크플로가 같은 리듬으로 재충돌한다.
          for i in 1 2 3 4 5 6 7 8; do
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            if git pull --rebase --autostash -X theirs origin "$BRANCH" && git push origin "$BRANCH"; then
              PUSHED=true
              break
            fi
            WAIT=$(( i * 7 + RANDOM % 15 ))
            echo "Push attempt $i failed, retrying in ${WAIT}s (jittered)..."
            sleep "$WAIT"
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::All 8 push attempts failed (main 경합) — 다음 스케줄에서 재시도"
            exit 1
          fi

      - name: Publish hot data to VERITY-data
        if: always()
        uses: ./.github/actions/publish-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.VERITY_DATA_PAT }}
          blob_token: ${{ secrets.VERCEL_BLOB_TOKEN }}
